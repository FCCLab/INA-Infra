    \nimport os\nimport yaml\nimport kubernetes\nfrom kubernetes.client.rest import\
    \ ApiException\nfrom datetime import datetime\nfrom dateutil.tz import tzutc\n\
    import json\nimport requests\n\nrequests.packages.urllib3.disable_warnings() \n\
    \nTIME_FORMAT = \"%Y-%m-%dT%H:%M:%SZ\"\nKUBERNETES_TYPE=str(os.getenv('KUBERNETES_TYPE','vanilla')).lower()\
    \    ##Allowed values VANILLA/Openshift\nif KUBERNETES_TYPE not in ['vanilla','openshift']:\n\
    \    print('Allowed values for kubernetes type are vanilla/openshift')\nNF_TYPE=str(os.getenv('NF_TYPE','amf'))\
    \      ## Network function name\nLABEL={'workload.nephio.org/oai': f\"{NF_TYPE}\"\
    }   ## Labels to put inside the owned resources\nOP_CONF_PATH=str(os.getenv('OP_CONF_PATH',f\"\
    /tmp/op/{NF_TYPE}.yaml\"))  ## Operators configuration file\nNF_CONF_PATH = str(os.getenv('NF_CONF_PATH',f\"\
    /tmp/nf/{NF_TYPE}.yaml\"))  ## Network function configuration file\nDEPLOYMENT_FETCH_INTERVAL=int(os.getenv('DEPLOYMENT_FETCH_INTERVAL',1))\
    \ # Fetch the status of deployment every x seconds\nDEPLOYMENT_FETCH_ITERATIONS=int(os.getenv('DEPLOYMENT_FETCH_ITERATIONS',100))\
    \  # Number of times to fetch the deployment\nLOG_LEVEL = str(os.getenv('LOG_LEVEL','INFO'))\
    \    ## Log level of the controller\nTESTING = str(os.getenv('TESTING','no'))\
    \    ## If testing the network function, it will remove the init container which\
    \ checks for NRFs availability\nHTTPS_VERIFY = bool(os.getenv('HTTPS_VERIFY',False))\
    \ ## To verfiy HTTPs certificates when communicating with cluster\nTOKEN=os.popen('cat\
    \ /var/run/secrets/kubernetes.io/serviceaccount/token').read() ## Token used to\
    \ communicate with Kube cluster\n_k8s_svc_host = os.getenv('KUBERNETES_SERVICE_HOST')\n\
    _k8s_svc_port = os.getenv('KUBERNETES_SERVICE_PORT', '443')\n_k8s_default = (\n\
    \    f'https://{_k8s_svc_host}:{_k8s_svc_port}' if _k8s_svc_host else 'http://127.0.0.1:8080'\n\
    )\nKUBERNETES_BASE_URL = str(os.getenv('KUBERNETES_BASE_URL', _k8s_default))\n\
    # Prefer ClusterIP when DNS name is configured but CoreDNS is unreachable.\nif\
    \ _k8s_svc_host and 'kubernetes.default' in KUBERNETES_BASE_URL:\n    KUBERNETES_BASE_URL\
    \ = f'https://{_k8s_svc_host}:{_k8s_svc_port}'\nLOADBALANCER_IP = str(os.getenv('LOADBALANCER_IP',None))\n\
    SVC_TYPE = str(os.getenv('SVC_TYPE','ClusterIP')) \n\nif SVC_TYPE not in ['ClusterIP',\
    \ 'LoadBalancer', 'NodePort']:\n    print(f\"SVC_TYPE is case sensitive are you\
    \ spelling {SVC_TYPE} correct?\")\n    sys.exit('-1')\n\ndef create_deployment(name:\
    \ str=None, \n                    namespace: str=None, \n                    compute:\
    \ dict=None, \n                    labels: dict=None, \n                    image:\
    \ str=None, \n                    image_pull_secrets: list=None, \n          \
    \          ports: list=None,\n                    nrf_svc:str=None,\n        \
    \            interfaces: list=None,\n                    config_map: str=None,\
    \ \n                    nf_type: str=None, \n                    sa_name: str=None,\n\
    \                    nad:dict=None,\n                    logger=None,\n      \
    \              kopf=None):\n    '''\n    :param name: name of the crd object\n\
    \    :type name: str\n    :param namespace: Namespace name\n    :type namespace:\
    \ str\n    :param nrf_svc: NRF svc\n    :type nrf_svc: str\n    :param compute:\
    \ compute resource req and limit\n    :type compute: dict\n    :param labels:\
    \ labels\n    :type labels: dict\n    :param image: image name\n    :type image:\
    \ str\n    :param image_pull_secrets: image_pull_secrets name\n    :type image_pull_secrets:\
    \ list\n    :param ports: list of ports\n    :type ports: list\n    :param interfaces:\
    \ list of interfaces to attach with this NF\n    :type interfaces: list\n    :param\
    \ config_map: config_map name\n    :type config_map: str\n    :param nf_type:\
    \ nf_type name\n    :type nf_type: str\n    :param sa_name: sa_name name\n   \
    \ :type sa_name: str\n    :param logger: logger\n    :type logger: <class 'kopf._core.actions.loggers.ObjectLogger'>\n\
    \    :param nad: network attachement defination\n    :type nad: dict\n    :param\
    \ kopf: Instance of kopf\n    :return: deployment\n    :rtype: dict\n    '''\n\
    \    _ports = []\n    _interfaces = []\n    error=False\n    for port in ports:\n\
    \        _ports.append(\n            {\n                'name':port['name'],\n\
    \                'containerPort':int(port['port']),\n                'protocol':port['protocol']\n\
    \            }\n            )\n    if nrf_svc is None:\n        nrf_svc = \"oai-nrf\"\
    \ #default value\n    # Wait for the rest of the dedicated 5GC before AMF starts\
    \ (NRF + CP peers + DB).\n    # ClusterIP DNS names match op-conf fqdn / mysql\
    \ Service in the profile ns.\n    init_script = f\"\"\"\nset -eu\nwait_tcp() {{\n\
    \  label=\"$1\"; host=\"$2\"; port=\"$3\"\n  echo \"waiting for ${{label}} tcp://${{host}}:${{port}}\"\
    \n  # Prefer nc only \u2014 curl telnet:// can hang and block the || fallback.\n\
    \  until nc -z -w2 \"$host\" \"$port\" >/dev/null 2>&1; do\n    sleep 1\n  done\n\
    \  echo \"  ${{label}} ready\"\n}}\nwait_nrf() {{\n  host=\"$1\"\n  url=\"http://${{host}}/nnrf-nfm/v1/nf-instances?nf-type=NRF\"\
    \n  echo \"waiting for nrf ${{host}} (NFM)\"\n  until curl --connect-timeout 1\
    \ --head -X GET \"$url\" --http2-prior-knowledge >/dev/null 2>&1; do\n    sleep\
    \ 1\n  done\n  echo \"  nrf ready\"\n}}\necho \"AMF dependency wait: mysql + 5GC\
    \ CP\"\nwait_tcp mysql mysql 3306\nwait_nrf \"{nrf_svc}\"\n# OAI SBI often returns\
    \ empty reply on GET / \u2014 TCP (nc) only.\nwait_tcp oai-udr oai-udr 80\nwait_tcp\
    \ oai-udm oai-udm 80\nwait_tcp oai-ausf oai-ausf 80\nwait_tcp oai-smf oai-smf\
    \ 80\necho \"all 5GC dependencies ready \u2014 starting AMF\"\n\"\"\".strip()\n\
    \    deployment = {\n                  \"apiVersion\": \"apps/v1\",\n        \
    \          \"kind\": \"Deployment\",\n                  \"metadata\": {\n    \
    \                \"name\": name,\n                    \"namespace\": namespace,\n\
    \                    \"labels\": labels\n                  },\n              \
    \    \"spec\": {\n                    \"replicas\": 1,\n                    \"\
    selector\": {\n                      \"matchLabels\": labels\n               \
    \     },\n                    \"strategy\": {\n                      \"type\"\
    : \"Recreate\"\n                    },\n                    \"template\": {\n\
    \                      \"metadata\": {\n                        \"labels\": labels\
    \ \n                        },\n                      \"spec\": {\n          \
    \              \"nodeSelector\": {\n                          \"kubernetes.io/arch\"\
    : \"amd64\"\n                        },\n                        \"securityContext\"\
    : {\n                          \"runAsGroup\": 0,\n                          \"\
    runAsUser\": 0\n                        },\n                        \"imagePullSecrets\"\
    :image_pull_secrets,\n                        \"initContainers\": [{\n       \
    \                     \"name\": 'wait-5gc',\n                            \"image\"\
    : \"docker.io/alpine/curl:3.14\",\n                            \"imagePullPolicy\"\
    : \"IfNotPresent\",\n                            \"command\": [\n            \
    \                'sh', \n                            '-c', \n                \
    \            init_script\n                            ]\n                    \
    \    }],\n                        \"containers\": [\n                        \
    \  {\n                            \"name\": name,\n                          \
    \  \"image\": image,\n                            \"imagePullPolicy\": \"IfNotPresent\"\
    ,\n                            \"resources\": {\n                            \
    \    \"requests\": {\n                                \"memory\": compute['req']['memory'],\n\
    \                                \"cpu\": compute['req']['cpu']\n            \
    \                    },\n                                \"limits\": {\n     \
    \                           \"memory\": compute['limits']['memory'],\n       \
    \                         \"cpu\": compute['limits']['cpu']\n                \
    \                }\n                            },\n                         \
    \   \"volumeMounts\": [\n                              {\n                   \
    \             \"mountPath\": f\"/openair-{nf_type}/etc\",\n                  \
    \              \"name\": \"configuration\"\n                              }],\n\
    \                            \"ports\": _ports,\n                            \"\
    command\": [\n                              f\"/openair-{nf_type}/bin/oai_{nf_type}\"\
    ,\n                              \"-c\",\n                              f\"/openair-{nf_type}/etc/{nf_type}.yaml\"\
    ,\n                              \"-o\"\n                            ]\n     \
    \                     }\n                        ],\n                        \"\
    volumes\": [\n                          {\n                            \"configMap\"\
    : {\n                              \"name\": config_map\n                    \
    \        },\n                            \"name\": \"configuration\"\n       \
    \                   }\n                        ],\n                        \"\
    dnsPolicy\": \"ClusterFirst\",\n                        \"restartPolicy\": \"\
    Always\",\n                        \"serviceAccountName\": sa_name,\n        \
    \                \"terminationGracePeriodSeconds\": 5\n                      }\n\
    \                    }\n                  }\n                }\n\n    if interfaces\
    \ is not None:\n        for interface in interfaces:\n            nad_name=f\"\
    {name}-{interface['name']}\"\n            nad_status = create_nad(\n         \
    \                       name=nad_name,\n                                namespace=namespace,\n\
    \                                nad_config=nad,\n                           \
    \     labels=labels,\n                                logger=logger,\n       \
    \                         kopf=kopf,\n                                nf_type=nf_type)\n\
    \            if nad_status['status']:\n                _interfaces.append({'name':nad_status['name'],\n\
    \                                    'interface':interface['name'],\n        \
    \                            'ips':[interface['ipv4']['address']],\n         \
    \                           'gateway':[interface['ipv4']['gateway']]\n       \
    \                             })\n            else:\n                output =\
    \ {'message': 'Deployment failure',\n                          'reason': nad_status['reason'],\n\
    \                          'status': \"False\",\n                          'type':\
    \ \"Error\",\n                          'generation': 0,\n                   \
    \       'observedGeneration': 0,\n                          'ready': False,\n\
    \                          'error': True\n                          }\n      \
    \          logger.error(f\"Error {nad_status['reason']}, in creating deployment\
    \ {name} in namespace {namespace}\" )\n                return output\n       \
    \ deployment['spec']['template']['metadata'].update(\n                       \
    \                 {'annotations':\n                                          \
    \  {'k8s.v1.cni.cncf.io/networks': json.dumps(_interfaces)}})\n    if TESTING\
    \ == 'yes':\n        deployment['spec']['template']['spec'].pop('initContainers')\n\
    \n    if str(os.getenv('DEBUG_SIDECAR', 'no')).lower() in ('yes', 'true', '1'):\n\
    \        deployment['spec']['template']['spec']['containers'].append({\n     \
    \       \"name\": \"debug\",\n            \"image\": os.getenv('DEBUG_SIDECAR_IMAGE',\
    \ 'nicolaka/netshoot'),\n            \"command\": [\"sleep\", \"infinity\"],\n\
    \            \"securityContext\": {\n                \"capabilities\": {\"add\"\
    : [\"NET_ADMIN\", \"NET_RAW\"]},\n            },\n            \"resources\": {\n\
    \                \"requests\": {\"cpu\": \"50m\", \"memory\": \"64Mi\"},\n   \
    \             \"limits\": {\"cpu\": \"200m\", \"memory\": \"128Mi\"},\n      \
    \      },\n        })\n\n    kopf.adopt(deployment)  # includes namespace, name,\
    \ existing labels\n    kopf.label(deployment, labels, nested=['spec.template'])\n\
    \    creation_timestamp = None\n    available_replicas = None\n    last_transition_time\
    \ = datetime.now().strftime(TIME_FORMAT) \n    message = f\"{name} pod(s) is(are)\
    \ creating\"\n    reason = \"MinimumReplicasNotAvailable\"\n    _type = \"Progressing\"\
    \n    generation = 0\n    ready = False\n    observed_generation = 0\n    _status\
    \ = \"False\"\n    try:\n        api = kubernetes.client.AppsV1Api()\n       \
    \ obj = api.create_namespaced_deployment(\n                namespace=namespace,\n\
    \                body=deployment\n            ).to_dict()\n        status = obj['status']\n\
    \        creation_timestamp = obj['metadata']['creation_timestamp']\n        available_replicas\
    \ = status['available_replicas']        \n        if 'generation' in obj['metadata'].keys():\n\
    \            generation = obj['metadata']['generation']\n        observed_generation\
    \ = status['observed_generation']\n        if status['conditions'] is not None\
    \ and len(status['conditions'])>0:\n            last_transition_time = status['conditions'][0]['last_transition_time']\n\
    \            message = status['conditions'][0]['message']\n            reason\
    \ = status['conditions'][0]['reason']\n            _status = status['conditions'][0]['status']\n\
    \            ready = status['ready_replicas'] is not None and int(status['ready_replicas'])\n\
    \            _type = status['conditions'][0]['type']\n    except ApiException\
    \ as e:\n        if getattr(e, 'status', None) == 409 or getattr(e, 'reason',\
    \ None) == 'Conflict':\n            logger.warning(f\"Deployment {name} already\
    \ exists in namespace {namespace}; reconciling\")\n            existing = api.read_namespaced_deployment(name=name,\
    \ namespace=namespace)\n            cur_image = None\n            for c in existing.spec.template.spec.containers:\n\
    \                if c.name == name:\n                    cur_image = c.image\n\
    \                    break\n            if cur_image is None:\n              \
    \  cur_image = existing.spec.template.spec.containers[0].image\n            if\
    \ cur_image != image:\n                logger.info(f\"Updating deployment {name}\
    \ image {cur_image} -> {image}\")\n                for c in existing.spec.template.spec.containers:\n\
    \                    if c.name == name:\n                        c.image = image\n\
    \                        break\n                else:\n                    existing.spec.template.spec.containers[0].image\
    \ = image\n                obj = api.replace_namespaced_deployment(\n        \
    \            name=name, namespace=namespace, body=existing\n                ).to_dict()\n\
    \            else:\n                obj = existing.to_dict()\n            status\
    \ = obj['status']\n            creation_timestamp = obj['metadata']['creation_timestamp']\n\
    \            available_replicas = status.get('available_replicas')\n         \
    \   if 'generation' in obj['metadata'].keys():\n                generation = obj['metadata']['generation']\n\
    \            observed_generation = status.get('observed_generation', 0)\n    \
    \        if status.get('conditions') is not None and len(status['conditions'])\
    \ > 0:\n                last_transition_time = status['conditions'][0]['last_transition_time']\n\
    \                message = status['conditions'][0]['message']\n              \
    \  reason = status['conditions'][0]['reason']\n                _status = status['conditions'][0]['status']\n\
    \                ready = status.get('ready_replicas') is not None and int(status['ready_replicas'])\n\
    \                _type = status['conditions'][0]['type']\n        else:\n    \
    \        logger.error(f\"Exception with reason {e.reason}, code {e.status} in\
    \ creating deployment {name} in namespace {namespace}\" )\n            raise kopf.PermanentError(f\"\
    Can not create Deployment {name} in namespace {namespace} reason {e.reason}\"\
    )\n\n\n    output = {'last_transition_time': last_transition_time,\n         \
    \     'message': message,\n              'reason': reason,\n              'status':\
    \ _status,\n              'type': \"Progressing\",\n              'generation':\
    \ generation,\n              'observedGeneration': observed_generation,\n    \
    \          'ready': ready,\n              'creation_timestamp': creation_timestamp,\n\
    \              'error': error\n              }\n    return output\n\n\ndef create_sa(name:str=None,\
    \ namespace: str=None, labels:dict=None, logger=None,kopf=None ):\n    '''\n \
    \   :param name: name of the service account\n    :type name: str\n    :param\
    \ namespace: Namespace name\n    :type namespace: str\n    :param labels: labels\n\
    \    :type labels: dict\n    :param logger: logger\n    :type logger: <class 'kopf._core.actions.loggers.ObjectLogger'>\n\
    \    :param kopf: Instance of kopf\n    :return: status\n    :rtype: dict\n  \
    \  '''\n    sa   =  {\n              \"apiVersion\": \"v1\",\n              \"\
    kind\": \"ServiceAccount\",\n              \"metadata\": {\n                \"\
    name\": name,\n                \"namespace\":namespace\n              }\n    \
    \        }\n    kopf.adopt(sa)  # includes namespace, name, existing labels\n\
    \    kopf.label(sa, labels, nested=['spec.template'])\n    creation_timestamp\
    \ =  None\n    try:\n        api = kubernetes.client.CoreV1Api()\n        obj\
    \ = api.create_namespaced_service_account(\n                namespace=namespace,\n\
    \                body=sa\n            ).to_dict()\n        creation_time =  obj['metadata']['creation_timestamp']\n\
    \        name = obj['metadata']['name']\n    except ApiException as e:\n     \
    \   if getattr(e, 'status', None) == 409 or getattr(e, 'reason', None) == 'Conflict':\n\
    \            logger.warning(f\"ServiceAccount {name} already exists in namespace\
    \ {namespace}; reusing\")\n            obj = api.read_namespaced_service_account(name=name,\
    \ namespace=namespace).to_dict()\n            creation_timestamp = obj['metadata']['creation_timestamp']\n\
    \            name = obj['metadata']['name']\n        else:\n            logger.error(f\"\
    Exception with reason {e.reason}, code {e.status} in creating service account\
    \ {name} in namespace {namespace}\")\n            raise kopf.PermanentError(f\"\
    Can not create service account {name} in namespace {namespace} reason {e.reason}\"\
    )\n\n    return {'creation_timestamp':creation_timestamp,'name':name}\n\ndef create_config_map(name:\
    \ str=None, namespace: str=None, \n                     labels:dict=None, configuration:dict=None,\
    \ \n                     logger=None, kopf=None, nf_type: str=None):\n    '''\n\
    \    :param name: name of the configmap\n    :type name: str\n    :param namespace:\
    \ Namespace name\n    :type namespace: str\n    :param labels: labels\n    :type\
    \ labels: dict\n    :param config: configuration \n    :type config: dict\n  \
    \  :param logger: logger\n    :type logger: <class 'kopf._core.actions.loggers.ObjectLogger'>\n\
    \    :param kopf: Instance of kopf\n    :return: status\n    :rtype: dict\n  \
    \  ''' \n\n    metadata = kubernetes.client.V1ObjectMeta(\n        name=name,\n\
    \        namespace=namespace,\n    )\n\n    configmap = kubernetes.client.V1ConfigMap(\n\
    \        api_version=\"v1\",\n        kind=\"ConfigMap\",\n        data={f\"{nf_type}.yaml\"\
    :configuration},\n        metadata=metadata\n    )\n    kopf.adopt(configmap)\
    \  # includes namespace, name, existing labels\n    kopf.label(configmap, labels,\
    \ nested=['spec.template'])\n\n    creation_timestamp =  None\n    try:\n    \
    \    api = kubernetes.client.CoreV1Api()\n        obj = api.create_namespaced_config_map(\n\
    \                namespace=namespace,\n                body=configmap\n      \
    \      ).to_dict()\n        creation_time =  obj['metadata']['creation_timestamp']\n\
    \        name = obj['metadata']['name']\n    except ApiException as e:\n     \
    \   if getattr(e, 'status', None) == 409 or getattr(e, 'reason', None) == 'Conflict':\n\
    \            logger.warning(\n                f\"ConfigMap {name} already exists\
    \ in namespace {namespace}; replacing\"\n            )\n            obj = api.replace_namespaced_config_map(\n\
    \                name=name,\n                namespace=namespace,\n          \
    \      body=configmap,\n            ).to_dict()\n            creation_timestamp\
    \ = obj['metadata']['creation_timestamp']\n            name = obj['metadata']['name']\n\
    \        else:\n            logger.error(f\"Exception with reason {e.reason},\
    \ code {e.status} in creating configmap {name} in namespace {namespace}\")\n \
    \           raise kopf.PermanentError(f\"Can not create configmap {name} in namespace\
    \ {namespace} reason {e.reason}\")\n            return {}\n\n    return {'creation_timestamp':creation_timestamp,'name':name}\n\
    \n\ndef deployment_status(deployment_name: str=None, namespace: str=None,logger=None,\
    \ kopf=None):\n    '''\n    :param deployment_name: name of the deployment\n \
    \   :type deployment_name: str\n    :param namespace: Namespace name\n    :type\
    \ namespace: str\n    :param logger: logger\n    :type logger: <class 'kopf._core.actions.loggers.ObjectLogger'>\n\
    \    :param kopf: Instance of kopf\n    :return: status\n    :rtype: dict\n  \
    \  ''' \n    try:\n        api = kubernetes.client.AppsV1Api()\n        response\
    \ = api.read_namespaced_deployment_status(name=deployment_name,namespace=namespace).to_dict()\n\
    \        status = response['status']\n    except ApiException as e:\n        logger.error(f\"\
    Exception with reason {e.reason}, code {e.status} in reading the status of deployment\
    \ {deployment_name} in namespace {namespace}\" )\n        raise kopf.PermanentError(f\"\
    Exception with reason {e.reason}, code {e.status} in reading the status of deployment\
    \ {deployment_name} in namespace {namespace}\")\n\n    creation_timestamp = response['metadata']['creation_timestamp']\n\
    \    available_replicas = status['available_replicas']\n    last_transition_time\
    \ = datetime.now().strftime(TIME_FORMAT) \n    message = f\"{deployment_name}\
    \ pod(s) is(are) creating\"\n    reason = \"MinimumReplicasNotAvailable\"\n  \
    \  _type = \"Progressing\"\n    generation = 0\n    ready = False\n    observed_generation\
    \ = 0\n    _status = \"False\"\n    if 'generation' in response['metadata'].keys():\n\
    \        generation = response['metadata']['generation']\n\n    conditions = [\n\
    \                  {'lastTransitionTime': last_transition_time,\n            \
    \      'message': message,\n                  'reason': reason,\n            \
    \      '_status': _status,\n                  'type': \"Progressing\",\n     \
    \             'observedGeneration': generation,\n                  }\n       \
    \         ]\n\n    if status['conditions'] is not None and len(status['conditions'])>0:\n\
    \        ready = status['ready_replicas'] is not None and int(status['ready_replicas'])\n\
    \        observed_generation = status['observed_generation']\n        conditions\
    \ = []\n        for c in status['conditions']:\n            conditions.append({\n\
    \                                'lastTransitionTime':datetime.now().strftime(TIME_FORMAT),\n\
    \                                'message':c['message'],\n                   \
    \             'reason':c['reason'],\n                                'status':c['status'],\n\
    \                                'type': c['type'],\n                        \
    \        'observedGeneration':generation\n                                })\n\
    \    output = {'conditions':conditions,\n              'observedGeneration': observed_generation,\n\
    \              'ready': ready\n              }\n\n    return output\n\ndef create_svc(name:\
    \ str=None, \n               namespace: str=None, \n               labels: dict=None,\
    \ \n               ports: list=None,\n               logger=None,\n          \
    \     kopf=None\n            ):\n    '''\n    :param name: name of the configmap\n\
    \    :type name: str\n    :param namespace: Namespace name\n    :type namespace:\
    \ str\n    :param labels: labels\n    :type labels: dict\n    :param ports: ports\
    \ \n    :type config: dict\n    :param logger: logger\n    :type logger: <class\
