    \        \"model\": model,\n        \"vllm_url\": VLLM_URL,\n    }\n\n\n@app.put(\"\
    /api/hf-token\")\ndef api_save_token(body: TokenIn) -> dict:\n    token = body.token.strip()\n\
    \    if not token:\n        raise HTTPException(status_code=400, detail=\"token\
    \ is required\")\n    ns = _ns()\n    payload = {\n        \"apiVersion\": \"\
    v1\",\n        \"kind\": \"Secret\",\n        \"metadata\": {\n            \"\
    name\": SECRET_NAME,\n            \"namespace\": ns,\n            \"labels\":\
