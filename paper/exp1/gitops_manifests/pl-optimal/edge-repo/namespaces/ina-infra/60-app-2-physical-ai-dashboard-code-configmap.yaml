    \ \"2.5\"))\n\n\ndef _http_url(host: str, port: int = UE_CONSOLE_PORT) -> str:\n\
    \    if port == 80:\n        return f\"http://{host}/\"\n    return f\"http://{host}:{port}/\"\
    \n\napp = FastAPI(title=\"Physical AI console\", docs_url=\"/api/docs\")\n\n\n\
