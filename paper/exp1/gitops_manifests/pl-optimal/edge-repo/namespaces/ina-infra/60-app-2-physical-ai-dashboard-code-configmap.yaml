    \    pcode, pods = _k8s(\"GET\", f\"/api/v1/namespaces/{ns}/pods\")\n    pods_by_app:\
    \ dict[str, dict] = {}\n    if pcode == 200:\n        for pod in (pods or {}).get(\"\
    items\") or []:\n            labels = (pod.get(\"metadata\") or {}).get(\"labels\"\
