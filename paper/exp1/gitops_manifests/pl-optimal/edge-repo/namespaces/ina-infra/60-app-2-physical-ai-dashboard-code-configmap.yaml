    : last_err}\n\n\n@app.get(\"/api/ues\")\ndef api_ues() -> dict:\n    ns = _ns()\n\
    \    code, body = _k8s(\"GET\", f\"/apis/apps/v1/namespaces/{ns}/deployments\"\
    )\n    if code not in (200, 201):\n        raise HTTPException(status_code=502,\
