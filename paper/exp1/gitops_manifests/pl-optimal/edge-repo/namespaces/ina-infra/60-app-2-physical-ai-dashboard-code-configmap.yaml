    \        code, resp = _k8s(\"PATCH\", f\"/api/v1/namespaces/{ns}/secrets/{SECRET_NAME}\"\
    , payload, extra_headers={\"Content-Type\": \"application/merge-patch+json\"})\n\
    \    else:\n        code, resp = _k8s(\"POST\", f\"/api/v1/namespaces/{ns}/secrets\"\
