apiVersion: workload.nephio.org/v1alpha1
kind: NFDeployment
metadata:
  name: amf-core
  namespace: ina-infra
  labels:
    app.kubernetes.io/part-of: ina-infra
    app.kubernetes.io/component: dedicated-core
spec:
  provider: amf.openairinterface.org
  capacity:
    maxSubscribers: 64
  interfaces:
  - name: n2
    ipv4:
      address: 10.1.140.10/24
      gateway: 10.1.140.1
    vlanID: 4
  networkInstances:
  - name: vpc-ran
    interfaces:
    - n2
  parametersRefs:
  - name: amf-core-config
    apiVersion: workload.nephio.org/v1alpha1
    kind: NFConfig
