   font-size: 11px;\n      text-transform: uppercase;\n      letter-spacing: 0.08em;\n      color: var(--text-dim);\n      margin-bottom: 10px;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 8px;\n    }\n\n    .kpi-value {\n      font-family: 'Space Grotesk', sans-serif;\n      font-size: 22px;\n      font-weight: 700;\n      letter-spacing: -0.02em;\n      color: var(--text);\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      line-height: 1.2;\n      word-break: break-word;\n    }\n    .kpi-value.mono {\n      font-family: 'IBM Plex Mono', monospace;\n      font-size: 15px;\n      font-weight: 600;\n      letter-spacing: 0;\n    }\n\n    /* Standard Cards */\n    .card {\n      background: var(--card);\n      border: 1px solid var(--border);\n      border-radius: var(--radius-lg);\n      padding: 20px 24px;\n      box-shadow: var(--shadow-tier);\n      backdrop-filter: blur(12px);\n      position: relative;\n    }\n\n    .card.tier::before {\n      content: '';\n      position: absolute;\n      top: 0;\n      left: 24px;\n      right: 24px;\n      height: 1px;\n      background: linear-gradient(90deg, transparent, rgba(22, 230, 160, 0.4), transparent);\n    }\n\n    .card-header {\n      margin-bottom: 16px;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 12px;\n      flex-wrap: wrap;\n    }\n\n    .card-title {\n      font-family: 'Space Grotesk', sans-serif;\n      font-size: 15px;\n      font-weight: 700;\n      color: var(--text);\n      display: flex;\n      align-items: center;\n      gap: 8px;\n    }\n\n    .card-subtitle {\n      color: var(--text-dim);\n      font-size: 13px;\n      margin-top: 4px;\n      line-height: 1.4;\n    }\n\n    /* Form Controls */\n    .row {\n      display: flex;\n      gap: 10px;\n      flex-wrap: wrap;\n      align-items: center;\n    }\n\n    label {\n      display: block;\n      font-size: 12px;\n \
