 1.6;\n    }\n\n    .prompt-presets {\n      display: flex;\n      gap: 6px;\n      flex-wrap: wrap;\n      margin-top: 8px;\n    }\n    .preset-chip {\n      font-size: 11px;\n      background: var(--surface);\n      border: 1px solid var(--border);\n      color: var(--text-dim);\n      padding: 3px 8px;\n      border-radius: 999px;\n      cursor: pointer;\n      transition: all 0.15s ease;\n    }\n    .preset-chip:hover {\n      color: var(--accent);\n      border-color: rgba(22, 230, 160, 0.4);\n      background: var(--surface-2);\n    }\n\n    /* Messages & Alerts */\n    .msg-box {\n      font-size: 12px;\n      margin-top: 10px;\n      padding: 8px 12px;\n      border-radius: var(--radius-sm);\n      display: none;\n    }\n    .msg-box.show { display: block; }\n    .msg-box.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(22, 230, 160, 0.3); }\n    .msg-box.err { background: var(--bad-bg); color: var(--bad); border: 1px solid rgba(255, 90, 110, 0.3); }\n\n    a { color: var(--accent); text-decoration: none; }\n    a:hover { text-decoration: underline; }\n    code { font-family: 'IBM Plex Mono', monospace; color: var(--accent); background: rgba(22, 230, 160, 0.08); padding: 1px 4px; border-radius: 3px; }\n\n/* CCTV-like left rail + tabs for HTML consoles */\nhtml, body { height: 100%; overflow: hidden; }\n.app {\n  display: flex;\n  align-items: stretch;\n  height: 100vh;\n  max-height: 100vh;\n  overflow: hidden;\n}\n.app-body {\n  flex: 1;\n  min-width: 0;\n  display: flex;\n  flex-direction: column;\n  height: 100vh;\n  overflow: hidden;\n}\n.rail {\n  width: 92px;\n  flex: 0 0 92px;\n  height: 100vh;\n  border-right: 1px solid var(--border);\n  display: flex;\n  flex-direction: column;\n  padding: 14px 10px 12px;\n  background: var(--surface);\n}\n.rail-brand {\n  display: flex;\n  justify-content: center;\n  padding: 2px 0 14px;\n  border-bottom: 1px solid var(--border);\n  margin-bottom: 12px;\n}\n.rail-logo { width: 56px; height: auto; display: block; }\n.rail-nav { display: flex; flex-direction: column; gap: 6px; flex: 1; }\n.rail-tab {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 5px;\n  width: 100%;\n  min-height: 54px;\n  padding: 6px 4px;\n  border: 1px solid transparent;\n  border-radius: 12px;\n  background: transparent;\n  color: var(--text-dim);\n  cursor: pointer;\n  font: inherit;\n}\n.rail-tab-icon { display: grid; place-items: center; width: 22px; height: 22px; }\n.rail-tab-icon svg { width: 20px; height: 20px; }\n.rail-tab-label {\n  font-size: 10px;\n  font-weight: 600;\n  color: var(--text-faint);\n  line-height: 1.15;\n  text-align: center;\n}\n.rail-tab:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }\n.rail-tab-active {\n  background: rgba(22, 230, 160, 0.10);\n  color: var(--accent);\n  border-color: rgba(22, 230, 160, 0.22);\n}\n.rail-tab-active .rail-tab-label { color: var(--accent); }\n.rail-tab-active::before {\n  content: \"\";\n  position: absolute;\n  left: -10px;\n  top: 50%;\n  transform: translateY(-50%);\n  width: 3px;\n  height: 24px;\n  border-radius: 0 3px 3px 0;\n  background: var(--accent);\n}\n.rail-foot {\n  margin-top: auto;\n  padding-top: 12px;\n  border-top: 1px solid var(--border);\n  display: flex;\n  justify-content: center;\n}\n.rail-status { display: flex; flex-direction: column; align-items: center; gap: 6px; }\n.rail-status-dot {\n  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);\n  box-shadow: 0 0 0 3px rgba(22, 230, 160, 0.18);\n}\n.rail-status-text { font-size: 8.5px; font-weight: 700; color: var(--text-faint); text-align: center; }\n.topbar {\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  padding: 12px 20px;\n  background: rgba(11, 17, 32, 0.82);\n  backdrop-filter: blur(16px);\n  border-bottom: 1px solid var(--border);\n  flex-shrink: 0;\n}\n.crumb { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }\n.site-badge {\n  font-size: 11px; font-weight: 600; color: var(--accent);\n  background: rgba(22, 230, 160, 0.12);\n  padding: 5px 11px; border-radius: 20px; white-space: nowrap;\n}\n.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n.dash {\n  flex: 1;\n  min-height: 0;\n  overflow: auto;\n  padding: 16px 22px 32px;\n  display: grid;\n  gap: 16px;\n  width: 100%;\n  max-width: none;\n}\n.studio-grid {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);\n  grid-template-rows: auto minmax(200px, 1fr) auto auto;\n  gap: 10px 18px;\n  align-items: stretch;\n}\n.studio-col {\n  display: grid;\n  grid-template-rows: subgrid;\n  grid-row: 1 / -1;\n  min-width: 0;\n}\n.studio-col label { margin-bottom: 0; }\n.studio-col textarea,\n.studio-col pre {\n  min-height: 200px;\n  height: 100%;\n  max-height: none;\n  margin: 0;\n  box-sizing: border-box;\n}\n.studio-col-out pre { grid-row: 2 / -1; }\n.studio-col .prompt-presets { margin-top: 0; }\n.studio-col .row { margin-top: 0 !important; }\n@media (max-width: 1100px) {\n  .studio-grid {\n    grid-template-columns: 1fr;\n    grid-template-rows: none;\n  }\n  .studio-col { display: flex; flex-direction: column; gap: 8px; grid-row: auto; }\n  .studio-col-out pre { grid-row: auto; }\n}\n.tab-panel { display: grid; gap: 16px; width: 100%; min-width: 0; }\n.docs-lead { font-size: 13px; color: var(--text-dim); line-height: 1.55; margin: 8px 0 0; }\n.docs-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }\n.docs-table th, .docs-table td {\n  text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top;\n}\n.docs-table th { color: var(--text-faint); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }\n.docs-badge-get { color: var(--accent); font-weight: 700; font-size: 11px; }\n.docs-badge-post { color: var(--accent2);\
    \ font-weight: 700; font-size: 11px; }\n.docs-badge-put { color: var(--accent-orange); font-weight: 700; font-size: 11px; }\n.docs-badge-del { color: var(--bad); font-weight: 700; font-size: 11px; }\n\n  </style>\n</head>\n<body>\n<div class=\"app theme-dark\">\n  <aside class=\"rail\">\n    <div class=\"rail-brand\" title=\"Physical AI · NeuroRAN\"><img class=\"rail-logo\" src=\"/static/logos/NeuroRAN.png\" alt=\"NeuroRAN\" /></div>\n    <nav class=\"rail-nav\" aria-label=\"Main navigation\">\n      <button type=\"button\" class=\"rail-tab rail-tab-active\" data-tab=\"overview\" onclick=\"setConsoleTab('overview')\">\n        <span class=\"rail-tab-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/></svg></span>\n        <span class=\"rail-tab-label\">Overview</span>\n      </button>\n      <button type=\"button\" class=\"rail-tab\" data-tab=\"ues\" onclick=\"setConsoleTab('ues')\">\n        <span class=\"rail-tab-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg></span>\n        <span class=\"rail-tab-label\">UEs</span>\n      </button>\n      <button type=\"button\" class=\"rail-tab\" data-tab=\"studio\" onclick=\"setConsoleTab('studio')\">\n        <span class=\"rail-tab-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polygon points=\"5 3 19 12 5 21 5 3\"/></svg></span>\n        <span class=\"rail-tab-label\">Studio</span>\n      </button>\n      <button type=\"button\" class=\"rail-tab\" data-tab=\"token\" onclick=\"setConsoleTab('token')\">\n        <span class=\"rail-tab-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/></svg></span>\n        <span class=\"rail-tab-label\">Token</span>\n      </button>\n      <button type=\"button\" class=\"rail-tab\" data-tab=\"docs\" onclick=\"setConsoleTab('docs')\">\n        <span class=\"rail-tab-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg></span>\n        <span class=\"rail-tab-label\">Docs</span>\n      </button>\n    </nav>\n    <div class=\"rail-foot\"><div class=\"rail-status\"><span class=\"rail-status-dot\"></span><span class=\"rail-status-text\">PAI</span></div></div>\n  </aside>\n  <div class=\"app-body\">\n    <header class=\"topbar\">\n      <div class=\"crumb\" id=\"crumb\">Physical AI · Cosmos3</div>\n      <span class=\"site-badge\">INA · Physical AI</span>\n      <div class=\"topbar-right\">\n        <div class=\"row\" id=\"header-pills\">\n        <span class=\"pill\"><span class=\"dot pulse\"></span> connecting…</span>\n      </div>\n      <a class=\"ext-link\" href=\"/api/docs\" target=\"_blank\" rel=\"noreferrer\" title=\"Swagger REST API Reference\">Swagger API</a>\n      <a class=\"ext-link grafana\" href=\"http://10.1.137.105:3000/d/ina-physical-ai/physical-ai-metrics?orgId=1&refresh=5s\" target=\"_blank\" rel=\"noreferrer\" title=\"Open Grafana Physical AI Metrics\">\n        <span>Grafana</span>\n        <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3\"/></svg>\n      </a>\n      </div>\n    </header>\n        <main class=\"dash\">\n      <div class=\"tab-panel\" data-tab=\"overview\">\n    <div class=\"section-label\"><span class=\"section-bar\"></span><span class=\"section-text\">Status</span></div>\n    <div class=\"kpi-strip kpi-strip-status\">\n      <div class=\"kpi-card\">\n        <div class=\"kpi-label\">HF Secret Token <span class=\"dot\" id=\"kpi-hf-dot\"></span></div>\n        <div class=\"kpi-value\" id=\"kpi-hf\">Checking…</div>\n      </div>\n      <div class=\"kpi-card\">\n        <div class=\"kpi-label\">vLLM Inference Engine <span class=\"dot\" id=\"kpi-vllm-dot\"></span></div>\n        <div class=\"kpi-value\" id=\"kpi-vllm\">Checking…</div>\n      </div>\n      <div class=\"kpi-card\">\n        <div class=\"kpi-label\">Active Model</div>\n        <div class=\"kpi-value\" id=\"kpi-model\">nvidia/Cosmos3-Nano</div>\n      </div>\n      <div class=\"kpi-card\">\n        <div class=\"kpi-label\">Cluster & Namespace</div>\n        <div class=\"kpi-value mono\" id=\"kpi-ns\">ina-infra · edge</div>\n      </div>\n      </div>\n      </div>\n      <div class=\"tab-panel\" data-tab=\"ues\">\n          <section class=\"card tier\">\n      <div class=\"card-header\">\n        <div>\n          <h2 class=\"card-title\">Connected UEs</h2>\n          <p class=\"card-subtitle\">Slice-2 UEs start sending automatically when they come up. Use Stop / Start on each card to pause or resume. Open the UE dashboard for the full log.</p>\n        </div>\n        <button type=\"button\" class=\"btn-secondary\" id=\"refresh-ues\">Refresh UEs</button>\n      </div>\n    <div class=\"kpi-strip kpi-strip-ue\">\n      <div class=\"kpi-card\">\n        <div class=\"kpi-label\">Connected <span class=\"dot\" id=\"kpi-ue-dot\"></span></div>\n        <div class=\"kpi-value\" id=\"kpi-ue-connected\">—</div>\n      </div>\n      <div class=\"kpi-card\">\n        <div class=\"kpi-label\">Sending</div>\n        <div class=\"kpi-value\" id=\"kpi-ue-sending\">—</div>\n      </div>\n      <div class=\"kpi-card\">\n        <div class=\"kpi-label\">PDU ready</div>\n        <div class=\"kpi-value\" id=\"kpi-ue-pdu\">—</div>\n      </div>\n      <div class=\"kpi-card\">\n        <div class=\"kpi-label\">Last latency</div>\n        <div class=\"kpi-value mono\" id=\"kpi-ue-lat\">—</div>\n      </div>\n    </div>\n      <div id=\"ue-ctrl-msg\" class=\"msg-box\"></div>\n      <div id=\"ue-list\" class=\"ue-grid\">Loading UEs…</div>\n    </section>\n\n      </div>\n      <div class=\"tab-panel\" data-tab=\"studio\">\n          <!-- Interactive Inference & Reasoning Studio -->\n    <section class=\"card tier\">\n      <div class=\"card-header\">\n        <div>\n          <h2 class=\"card-title\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polygon points=\"5 3 19 12 5 21 5 3\"/></svg>\n            Physical AI Prompt & Reasoning Studio\n          </h2>\n          <p class=\"card-subtitle\">Execute multimodal spatial reasoning and scene synthesis queries against the live vLLM server on port <code>8000</code>.</p>\n        </div>\n        <div class=\"row\">\n          <label style=\"margin:0; text-transform:none;\">Max Tokens:</label>\n          <select id=\"max-tokens\" style=\"width: auto; padding: 4px 8px; font-size: 12px;\">\n            <option value=\"128\">128 tokens</option>\n            <option value=\"256\" selected>256 tokens</option>\n            <option value=\"512\">512 tokens</option>\n            <option value=\"1024\">1024 tokens</option>\n          </select>\n        </div>\n      </div>\n\n      <div class=\"studio-grid\">\n      <div class=\"studio-col\">\n      <label>Prompt / Scenario Input</label>\n      <textarea id=\"prompt\">Analyze this warehouse corridor for an autonomous mobile robot: identify potential navigation hazards, dynamic obstacles, and suggest safe path vectors.</textarea>\n      <div class=\"prompt-presets\">\n        <span style=\"font-size: 11px; color: var(--text-faint); margin-right: 4px; align-self: center;\">Quick Presets:</span>\n        <button type=\"button\" class=\"preset-chip\" data-p=\"Analyze this warehouse corridor for an autonomous mobile robot: identify potential navigation hazards, dynamic obstacles, and suggest safe path vectors.\">Robot Navigation</button>\n        <button type=\"button\" class=\"preset-chip\" data-p=\"Describe the spatial relationships of all objects in this scene for a robotic manipulation arm.\">Spatial Scene Map</button>\n        <button type=\"button\" class=\"preset-chip\" data-p=\"Detect any safety rule violations or unauthorized personnel in this high-voltage substation zone.\">Industrial Safety Check</button>\n      </div>\n      <div class=\"row\">\n        <button type=\"button\" id=\"send-chat\" style=\"padding: 9px 18px;\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"/><polygon points=\"22 2 15 22 11 13 2 9 22 2\"/></svg>\n          Run Inference\n        </button>\n        <button type=\"button\" class=\"btn-secondary\" id=\"clear-out\">Clear Output</button>\n      </div>\n      </div>\n      <div class=\"studio-col studio-col-out\">\n        <label>Reasoning Output</label>\n        <pre id=\"output-box\">vLLM output will appear here once inference is requested…</pre>\n      </div>\n      </div>\n    </section>\n  \n      </div>\n            <div class=\"tab-panel\" data-tab=\"token\">\n          <!-- Hugging Face Token Configuration -->\n    <section class=\"card tier\">\n      <div class=\"card-header\">\n        <div>\n          <h2 class=\"card-title\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\" ry=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/></svg>\n            Hugging Face Model Access Token\n          </h2>\n          <p class=\"card-subtitle\">\n            Cosmos3-Nano requires\
    \ authenticated license acceptance on <a href=\"https://huggingface.co/nvidia/Cosmos3-Nano\" target=\"_blank\" rel=\"noreferrer\">huggingface.co/nvidia/Cosmos3-Nano</a>. Token is saved securely into Secret <code>ina-hf-token</code>.\n          </p>\n        </div>\n      </div>\n\n      <label>User Access Token (Read)</label>\n      <div class=\"row\">\n        <input id=\"token\" type=\"password\" placeholder=\"hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\" autocomplete=\"off\" style=\"flex: 1 1 280px;\" />\n        <button type=\"button\" class=\"btn-secondary\" id=\"toggle-token\">Show</button>\n        <button type=\"button\" id=\"save-token\">Save Token & Start Engine</button>\n        <button type=\"button\" class=\"danger\" id=\"remove-token\">Remove</button>\n      </div>\n      <div class=\"msg-box\" id=\"token-msg\"></div>\n    </section>\n\n\n      </div>\n          <div class=\"tab-panel\" data-tab=\"docs\">\n        <section class=\"card tier\">\n          <div class=\"card-header\"><div>\n            <h2 class=\"card-title\">Physical AI · Slice 2</h2>\n            <p class=\"card-subtitle\">Cosmos3-Nano on A40 · vLLM sidecar</p>\n          </div></div>\n          <p class=\"docs-lead\">HF token, chat inference, and UE send/receive are proxied by this console. Interactive OpenAPI: <a href=\"/api/docs\" target=\"_blank\" rel=\"noreferrer\">/api/docs</a>.</p>\n          <table class=\"docs-table\">\n            <thead><tr><th>Method</th><th>Endpoint</th><th>Type</th><th>Description</th></tr></thead>\n            <tbody>\n              <tr><td><span class=\"docs-badge-get\">GET</span></td><td><code>/api/status</code></td><td>JSON</td><td>HF token configured, vLLM ready, namespace</td></tr><tr><td><span class=\"docs-badge-put\">PUT</span></td><td><code>/api/hf-token</code></td><td>JSON</td><td>Save Hugging Face token into Secret</td></tr><tr><td><span class=\"docs-badge-del\">DELETE</span></td><td><code>/api/hf-token</code></td><td>JSON</td><td>Remove stored token</td></tr><tr><td><span class=\"docs-badge-post\">POST</span></td><td><code>/api/chat</code></td><td>JSON</td><td>Run a vLLM prompt</td></tr><tr><td><span class=\"docs-badge-get\">GET</span></td><td><code>/api/ues</code></td><td>JSON</td><td>Slice-2 UE consoles</td></tr><tr><td><span class=\"docs-badge-get\">GET</span></td><td><code>/api/ues/{idx}/exchanges</code></td><td>JSON</td><td>Recent send/receive log</td></tr><tr><td><span class=\"docs-badge-post\">POST</span></td><td><code>/api/ues/{idx}/control</code></td><td>JSON</td><td>Enable or pause UE send</td></tr><tr><td><span class=\"docs-badge-post\">POST</span></td><td><code>/api/ues/{idx}/send-once</code></td><td>JSON</td><td>Trigger one UE inference</td></tr>\n            </tbody>\n          </table>\n        </section>\n      </div>\n    </main>\n  </div>\n</div>\n\n  <script>\n    const $ = (id) => document.getElementById(id);\n\n    async function req(url, opts) {\n      const r = await fetch(url, Object.assign({ headers: { \"Content-Type\": \"application/json\" } }, opts || {}));\n      const body = await r.json().catch(() => ({}));\n      if (!r.ok) {\n        const d = body && body.detail;\n        const msg = typeof d === \"string\" ? d : (d && (d.detail || d.message)) || body.message || r.statusText;\n        throw new Error(typeof msg === \"string\" ? msg : JSON.stringify(msg));\n      }\n      return body;\n    }\n\n    function showMsg(boxId, text, isError = false) {\n      const el = $(boxId);\n      el.className = `msg-box show ${isError ? 'err' : 'ok'}`;\n      el.textContent = text;\n      setTimeout(() => { el.className = 'msg-box'; }, 6000);\n    }\n\n    async function refreshStatus() {\n      try {\n        const s = await req(\"/api/status\");\n        \n        // Header Pills\n        $(\"header-pills\").innerHTML =\n          `<span class=\"pill ${s.configured ? \"ok\" : \"bad\"}\"><span class=\"dot ${s.configured ? \"pulse\" : \"\"}\"></span>${s.configured ? \"HF Token Active\" : \"HF Token Missing\"}</span>` +\n          `<span class=\"pill ${s.vllm_ready ? \"ok\" : \"bad\"}\"><span class=\"dot ${s.vllm_ready ? \"pulse\" : \"\"}\"></span>${s.vllm_ready ? \"vLLM Ready\" : \"vLLM Engine Offline\"}</span>` +\n          `<span class=\"pill mono\">${s.namespace}</span>`;\n\n        // KPI Strip\n        $(\"kpi-hf\").textContent = s.configured ? \"Saved in Secret\" : \"Missing / Not Set\";\n        $(\"kpi-hf-dot\").className = `dot ${s.configured ? \"ok pulse\" : \"bad\"}`;\n        $(\"kpi-vllm\").textContent = s.vllm_ready ? \"Online (200 OK)\" : \"Waiting for Token / Start\";\n        $(\"kpi-vllm-dot\").className = `dot ${s.vllm_ready ? \"ok pulse\" : \"bad\"}`;\n        if (s.model) $(\"kpi-model\").textContent = s.model;\n        $(\"kpi-ns\").textContent = `${s.namespace} · edge (gpu-a40)`;\n      } catch (e) {\n        $(\"header-pills\").innerHTML = `<span class=\"pill bad\"><span class=\"dot\"></span> Connection Error</span>`;\n      }\n    }\n\n    // Token toggle\n    $(\"toggle-token\").onclick = () => {\n      const input = $(\"token\");\n      input.type = input.type === \"password\" ? \"text\" : \"password\";\n      $(\"toggle-token\").textContent = input.type === \"password\" ? \"Show\" : \"Hide\";\n    };\n\n    // Save token\n    $(\"save-token\").onclick = async () => {\n      const tok = $(\"token\").value.trim();\n      if (!tok) {\n        showMsg(\"token-msg\", \"Please enter a valid Hugging Face access token.\", true);\n        return;\n      }\n      $(\"save-token\").disabled = true;\n      try {\n        const res = await req(\"/api/hf-token\", { method: \"PUT\", body: JSON.stringify({ token: tok }) });\n        showMsg(\"token-msg\", res.message || \"Token saved successfully. vLLM engine is initializing…\");\n        $(\"token\").value = \"\";\n        await refreshStatus();\n      } catch (e) {\n        showMsg(\"token-msg\", e.message, true);\n      } finally {\n        $(\"save-token\").disabled = false;\n      }\n    };\n\n    // Remove token\n    $(\"remove-token\").onclick = async () => {\n      if (!confirm(\"Remove the stored Hugging Face token secret?\")) return;\n      $(\"remove-token\").disabled = true;\n      try {\n        const res = await req(\"/api/hf-token\", { method: \"DELETE\" });\n        showMsg(\"token-msg\", res.message || \"Token secret removed.\");\n        await refreshStatus();\n      } catch (e) {\n        showMsg(\"token-msg\", e.message, true);\n      } finally {\n        $(\"remove-token\").disabled = false;\n      }\n    };\n\n    // Preset prompts\n    document.querySelectorAll(\".preset-chip\").forEach((btn) => {\n      btn.onclick = () => {\n        $(\"prompt\").value = btn.getAttribute(\"data-p\");\n      };\n    });\n\n    // Chat Inference\n    $(\"send-chat\").onclick = async () => {\n      const promptText = $(\"prompt\").value.trim();\n      if (!promptText) return;\n      \n      const maxTokens = parseInt($(\"max-tokens\").value, 10) || 256;\n      $(\"output-box\").textContent = \"Executing Cosmos3 inference on GPU worker… please wait…\";\n      $(\"send-chat\").disabled = true;\n\n      const t0 = performance.now();\n      try {\n        const res = await req(\"/api/chat\", {\n          method: \"POST\",\n          body: JSON.stringify({ prompt: promptText, max_tokens: maxTokens })\n        });\n        const elapsed = ((performance.now() - t0) / 1000).toFixed(2);\n        $(\"output-box\").textContent = `[Inference completed in ${elapsed}s]\\n\\n${res.text || JSON.stringify(res, null, 2)}`;\n      } catch (e) {\n        $(\"output-box\").textContent = `[Inference Error]: ${e.message}\\n\\nEnsure Hugging Face token is active and vLLM container has finished loading model weights.`;\n      } finally {\n        $(\"send-chat\").disabled = false;\n      }\n    };\n\n    $(\"clear-out\").onclick = () => {\n      $(\"output-box\").textContent = \"vLLM output will appear here once inference is requested…\";\n    };\n\n    let selectedUe = null;\n    const autoStarted = new Set(JSON.parse(sessionStorage.getItem(\"pai-auto-started\") || \"[]\"));\n    function rememberAutoStart(key) {\n      autoStarted.add(key);\n      sessionStorage.setItem(\"pai-auto-started\", JSON.stringify([...autoStarted]));\n    }\n\n    function isUeRunning(st) {\n      const v = st && st.send_enabled;\n      return v === true || v === \"true\" || v === 1 || v === \"1\";\n    }\n\n    function paintToggle(btn, running) {\n      if (!btn) return;\n      btn.disabled = false;\n      if (running) {\n        btn.className = \"danger ue-ctrl-btn\";\n        btn.setAttribute(\"data-action\", \"stop\");\n        btn.textContent = \"⏹ Stop\";\n      } else {\n        btn.className = \"ue-ctrl-btn\";\n        btn.setAttribute(\"data-action\", \"start\");\n        btn.textContent = \"▶ Start\";\n      }\n    }\n\n    function ueLatency(st) {\n      const rec = (st && st.last && st.last.received) || {};\n      const v = rec.latency_ms != null ? rec.latency_ms : st && st.latency_ms;\n      return (v != null && v !== \"\") ? Number(v) : null;\n    }\n\n    function fmtTok(n) {\n      const v = Number(n);\n      if (n == null || n === \"\" || Number.isNaN(v)) return \"—\";\n      return v.toLocaleString();\n    }\n\n    function ueTokenStats(st) {\n      const lastU = (st && st.last && st.last.received && st.last.received.usage) || {};\n      const hasCum = st && (st.prompt_tokens != null || st.completion_tokens != null);\n      return {\n        input: hasCum ? Number(st.prompt_tokens || 0) : Number(lastU.prompt_tokens || lastU.input_tokens || 0),\n        output: hasCum ? Number(st.completion_tokens || 0) : Number(lastU.completion_tokens || lastU.output_tokens || 0),\n        lastIn: Number(st && st.last_prompt_tokens != null ? st.last_prompt_tokens : (lastU.prompt_tokens || lastU.input_tokens || 0)),\n        lastOut: Number(st && st.last_completion_tokens != null ? st.last_completion_tokens : (lastU.completion_tokens || lastU.output_tokens\
    \ || 0)),\n        cumulative: !!hasCum,\n      };\n    }\n\n    function paintUeStats(ues) {\n      const n = ues.length;\n      const nOk = ues.filter(u => u.connected).length;\n      const nSend = ues.filter(u => isUeRunning(u.status)).length;\n      const nPdu = ues.filter(u => !!(u.status || {}).pdu_ready).length;\n      const lats = ues.map(u => ueLatency(u.status)).filter(v => v != null && !Number.isNaN(v));\n      if ($(\"kpi-ue-connected\")) $(\"kpi-ue-connected\").textContent = n ? `${nOk}/${n}` : \"0\";\n      if ($(\"kpi-ue-dot\")) $(\"kpi-ue-dot\").className = `dot ${nOk ? \"ok pulse\" : \"bad\"}`;\n      if ($(\"kpi-ue-sending\")) $(\"kpi-ue-sending\").textContent = n ? `${nSend}/${n}` : \"0\";\n      if ($(\"kpi-ue-pdu\")) $(\"kpi-ue-pdu\").textContent = n ? `${nPdu}/${n}` : \"0\";\n      if ($(\"kpi-ue-lat\")) {\n        $(\"kpi-ue-lat\").textContent = lats.length\n          ? `${Math.round(lats.reduce((a, b) => a + b, 0) / lats.length)} ms`\n          : \"—\";\n      }\n    }\n\n    function renderUes(data) {\n      const ues = (data && data.ues) || [];\n      paintUeStats(ues);\n      if (!ues.length) {\n        $(\"ue-list\").textContent = \"No slice-2 UEs found. Deploy Physical AI UE clients.\";\n        return;\n      }\n      $(\"ue-list\").innerHTML = ues.map(u => {\n        const st = u.status || {};\n        const running = isUeRunning(st);\n        const sending = running ? \"running\" : \"stopped\";\n        const ok = !!u.connected;\n        const dash = u.dashboard_url || u.console_url || \"\";\n        const lat = ueLatency(st);\n        const tok = ueTokenStats(st);\n        const inSub = tok.cumulative ? `last ${fmtTok(tok.lastIn)}` : \"last exchange\";\n        const outSub = tok.cumulative ? `last ${fmtTok(tok.lastOut)}` : \"last exchange\";\n        const ctrlBtn = running\n          ? `<button type=\"button\" class=\"danger ue-ctrl-btn\" data-ue-ctrl=\"${u.client_index}\" data-action=\"stop\">⏹ Stop</button>`\n          : `<button type=\"button\" class=\"ue-ctrl-btn\" data-ue-ctrl=\"${u.client_index}\" data-action=\"start\">▶ Start</button>`;\n        return `<div class=\"ue-card\" data-ue=\"${u.client_index}\">\n          <div class=\"row\" style=\"justify-content:space-between;\">\n            <strong>UE ${u.client_index}</strong>\n            <span class=\"pill ${running ? \"ok\" : \"bad\"}\">${ok ? sending : (u.pod_phase || \"down\")}</span>\n          </div>\n          <div class=\"mono\" style=\"font-size:12px;color:var(--text-dim);margin-top:6px;\">${u.name}</div>\n          <div class=\"mono\" style=\"font-size:12px;color:var(--text-dim);margin-top:4px;\">\n            ${u.console_ip || \"—\"} · ${u.console_mac || \"—\"}\n          </div>\n          <div class=\"mono\" style=\"font-size:12px;color:var(--text-dim);margin-top:4px;\">\n            PDU ${st.pdu_ready ? \"up\" : \"wait\"} · ${lat != null ? lat + \" ms\" : \"no latency\"}\n          </div>\n          <div class=\"ue-tok\">\n            <div class=\"ue-tok-item\">\n              <div class=\"ue-tok-label\">Input tokens</div>\n              <div class=\"ue-tok-value\">${fmtTok(tok.input)}</div>\n              <div class=\"ue-tok-sub\">${inSub}</div>\n            </div>\n            <div class=\"ue-tok-item\">\n              <div class=\"ue-tok-label\">Output tokens</div>\n              <div class=\"ue-tok-value\">${fmtTok(tok.output)}</div>\n              <div class=\"ue-tok-sub\">${outSub}</div>\n            </div>\n          </div>\n          <div class=\"row\" style=\"margin-top:10px;\">\n            ${ctrlBtn}\n            <a class=\"ue-dash-btn\" href=\"${dash}\" target=\"_blank\" rel=\"noreferrer\">Open UE dashboard</a>\n            ${u.console_url ? `<a class=\"ext-link\" href=\"${u.console_url}\" target=\"_blank\" rel=\"noreferrer\">Multus ${u.console_ip}</a>` : \"\"}\n          </div>\n        </div>`;\n      }).join(\"\");\n      $(\"ue-list\").querySelectorAll(\"[data-ue-ctrl]\").forEach(btn => {\n        btn.onclick = (ev) => {\n          ev.stopPropagation();\n          const idx = parseInt(btn.getAttribute(\"data-ue-ctrl\"), 10);\n          const start = btn.getAttribute(\"data-action\") === \"start\";\n          paintToggle(btn, start);\n          controlUe(idx, start);\n        };\n      });\n    }\n\n    async function refreshUes() {\n      try {\n        const data = await req(\"/api/ues\");\n        renderUes(data);\n        const ues = (data && data.ues) || [];\n        for (const u of ues) {\n          const key = String(u.name || u.client_index);\n          if (isUeRunning(u.status)) {\n            rememberAutoStart(key);\n            continue;\n          }\n          if (!u.connected || autoStarted.has(key)) continue;\n          rememberAutoStart(key);\n          controlUe(u.client_index, true);\n          break;\n        }\n      } catch (e) {\n        $(\"ue-list\").textContent = e.message;\n      }\n    }\n\n    $(\"refresh-ues\").onclick = refreshUes;\n\n    async function controlUe(idx, start) {\n      const msg = $(\"ue-ctrl-msg\");\n      if (msg) { msg.className = \"msg-box\"; msg.textContent = \"\"; }\n      const cardBtn = document.querySelector(`[data-ue-ctrl=\"${idx}\"]`);\n      paintToggle(cardBtn, start);\n      if (cardBtn) cardBtn.disabled = true;\n      try {\n        const resp = await req(`/api/ues/${idx}/control`, {\n          method: \"POST\",\n          body: JSON.stringify({ send_enabled: !!start }),\n        });\n        const running = isUeRunning(resp);\n        paintToggle(cardBtn, running);\n        if (msg) showMsg(\"ue-ctrl-msg\", running ? `UE ${idx} started` : `UE ${idx} stopped`, false);\n        selectedUe = idx;\n        await refreshUes();\n      } catch (e) {\n        paintToggle(cardBtn, !start);\n        if (msg) showMsg(\"ue-ctrl-msg\", `Unable to ${start ? \"start\" : \"stop\"} UE ${idx}: ${e.message}`, true);\n      }\n    }\n\n\n    const CONSOLE_CRUMBS = {\n      \"overview\": \"Physical AI · Cosmos3\",\n      \"ues\": \"Physical AI · Cosmos3\",\n      \"studio\": \"Physical AI · Cosmos3\",\n      \"token\": \"Physical AI · Cosmos3\",\n      \"docs\": \"Physical AI · Cosmos3\"\n    };\n    function setConsoleTab(id) {\n      document.querySelectorAll(\".rail-tab\").forEach((b) => b.classList.toggle(\"rail-tab-active\", b.dataset.tab === id));\n      const panel = document.querySelector(`.tab-panel[data-tab=\"${id}\"]`);\n      if (panel) panel.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n      const crumb = document.getElementById(\"crumb\");\n      if (crumb) crumb.textContent = CONSOLE_CRUMBS[id] || \"Physical AI · Cosmos3\";\n    }\n    refreshStatus();\n    refreshUes();\n    setInterval(refreshStatus, 6000);\n    setInterval(refreshUes, 8000);\n  </script>\n</body>\n</html>\n"
