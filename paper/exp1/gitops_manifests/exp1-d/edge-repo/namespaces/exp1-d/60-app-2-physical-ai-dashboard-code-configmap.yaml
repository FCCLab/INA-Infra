    \ return f\"02:0a:40:{SLICE_ID:02x}:00:{max(int(idx), 1):02x}\"\n\n\ndef _ns()\
    \ -> str:\n    return os.environ.get(\"POD_NAMESPACE\") or (NS_FILE.read_text().strip()\
    \ if NS_FILE.is_file() else \"ina-infra\")\n\n\ndef _k8s_ctx() -> tuple[str, ssl.SSLContext,\
    \ dict[str, str]]:\n    host = os.environ.get(\"KUBERNETES_SERVICE_HOST\")\n \
    \   port = os.environ.get(\"KUBERNETES_SERVICE_PORT\", \"443\")\n    if not host\
    \ or not TOKEN_FILE.is_file():\n        raise HTTPException(status_code=503, detail=\"\
    in-cluster Kubernetes credentials not available\")\n    token = TOKEN_FILE.read_text().strip()\n\
    \    ctx = ssl.create_default_context()\n    if CA_FILE.is_file():\n        ctx.load_verify_locations(str(CA_FILE))\n\
    \    headers = {\"Authorization\": f\"Bearer {token}\", \"Content-Type\": \"application/json\"\
    }\n    return f\"https://{host}:{port}\", ctx, headers\n\n\ndef _k8s(method: str,\
    \ path: str, body: Optional[dict] = None, extra_headers: Optional[dict] = None)\
    \ -> tuple[int, Any]:\n    base, ctx, headers = _k8s_ctx()\n    hdrs = dict(headers)\n\
    \    if extra_headers:\n        hdrs.update(extra_headers)\n    data = json.dumps(body).encode()\
    \ if body is not None else None\n    req = urllib.request.Request(base + path,\
    \ data=data, headers=hdrs, method=method)\n    try:\n        with urllib.request.urlopen(req,\
    \ context=ctx, timeout=20) as resp:\n            raw = resp.read().decode() or\
    \ \"{}\"\n            return resp.status, json.loads(raw)\n    except urllib.error.HTTPError\
    \ as exc:\n        raw = exc.read().decode(errors=\"replace\")\n        try:\n\
    \            parsed = json.loads(raw) if raw else {}\n        except json.JSONDecodeError:\n\
    \            parsed = {\"message\": raw[:400]}\n        return exc.code, parsed\n\
    \n\ndef _vllm(method: str, path: str, body: Optional[dict] = None) -> tuple[int,\
    \ Any]:\n    data = json.dumps(body).encode() if body is not None else None\n\
    \    headers = {\"Content-Type\": \"application/json\"} if body is not None else\
