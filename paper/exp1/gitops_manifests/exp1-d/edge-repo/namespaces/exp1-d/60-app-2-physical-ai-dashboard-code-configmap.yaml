"data":
  "app.py": "#!/usr/bin/env python3\n\"\"\"Physical AI console sidecar: HF token Secret\
    \ + vLLM health/chat proxy.\"\"\"\nfrom __future__ import annotations\n\nimport\
    \ base64\nimport json\nimport os\nimport ssl\nimport threading\nimport time\n\
    import urllib.error\nimport urllib.request\nfrom collections import deque\nfrom\
