    \ resp.status, json.loads(raw)\n    except urllib.error.HTTPError as exc:\n  \
    \      raw = exc.read().decode(errors=\"replace\")\n        try:\n           \
    \ parsed = json.loads(raw) if raw else {}\n        except json.JSONDecodeError:\n\
    \            parsed = {\"message\": raw[:400]}\n        return exc.code, parsed\n\
    \    except urllib.error.URLError as exc:\n        raise HTTPException(status_code=503,\
    \ detail=f\"vLLM not ready: {exc.reason}\") from exc\n\n\n@app.get(\"/api/status\"\
    )\ndef api_status() -> dict:\n    ns = _ns()\n    code, secret = _k8s(\"GET\"\
    , f\"/api/v1/namespaces/{ns}/secrets/{SECRET_NAME}\")\n    configured = code ==\
    \ 200 and bool((secret or {}).get(\"data\", {}).get(SECRET_KEY))\n    vllm_ok\
    \ = False\n    model = None\n    vcode, vbody = 0, {}\n    try:\n        vcode,\
    \ vbody = _vllm(\"GET\", \"/v1/models\")\n        vllm_ok = vcode == 200\n   \
    \     data = (vbody or {}).get(\"data\") or []\n        if data:\n           \
    \ model = data[0].get(\"id\")\n    except HTTPException:\n        vllm_ok = False\n\
    \    return {\n        \"ok\": True,\n        \"namespace\": ns,\n        \"secret\"\
    : SECRET_NAME,\n        \"configured\": configured,\n        \"vllm_ready\": vllm_ok,\n\
    \        \"model\": model,\n        \"vllm_url\": VLLM_URL,\n    }\n\n\n@app.put(\"\
    /api/hf-token\")\ndef api_save_token(body: TokenIn) -> dict:\n    token = body.token.strip()\n\
    \    if not token:\n        raise HTTPException(status_code=400, detail=\"token\
    \ is required\")\n    ns = _ns()\n    payload = {\n        \"apiVersion\": \"\
    v1\",\n        \"kind\": \"Secret\",\n        \"metadata\": {\n            \"\
    name\": SECRET_NAME,\n            \"namespace\": ns,\n            \"labels\":\
    \ {\"ina.lab/role\": \"hf-token\"},\n        },\n        \"type\": \"Opaque\"\
    ,\n        \"stringData\": {SECRET_KEY: token},\n    }\n    code, _ = _k8s(\"\
    GET\", f\"/api/v1/namespaces/{ns}/secrets/{SECRET_NAME}\")\n    if code == 200:\n\
    \        code, resp = _k8s(\"PATCH\", f\"/api/v1/namespaces/{ns}/secrets/{SECRET_NAME}\"\
    , payload, extra_headers={\"Content-Type\": \"application/merge-patch+json\"})\n\
    \    else:\n        code, resp = _k8s(\"POST\", f\"/api/v1/namespaces/{ns}/secrets\"\
    , payload)\n    if code not in (200, 201):\n        raise HTTPException(status_code=400,\
    \ detail=(resp or {}).get(\"message\", f\"secret apply failed ({code})\"))\n \
    \   restarted = _restart_deploy(ns)\n    return {\"ok\": True, \"configured\"\
    : True, \"restarted\": restarted, \"message\": \"Token saved.\" + (\" vLLM restarting.\"\
    \ if restarted else \"\")}\n\n\n@app.delete(\"/api/hf-token\")\ndef api_delete_token()\
    \ -> dict:\n    ns = _ns()\n    _k8s(\"DELETE\", f\"/api/v1/namespaces/{ns}/secrets/{SECRET_NAME}\"\
    )\n    restarted = _restart_deploy(ns)\n    return {\"ok\": True, \"configured\"\
    : False, \"restarted\": restarted, \"message\": \"Token removed.\"}\n\n\ndef _restart_deploy(ns:\
    \ str) -> bool:\n    stamp = datetime.now(timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\"\
    )\n    patch = {\"spec\": {\"template\": {\"metadata\": {\"annotations\": {\"\
