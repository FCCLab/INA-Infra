    )\ndef api_ue_control(idx: int, body: UeControlIn) -> dict:\n    payload = {k:\
    \ v for k, v in body.model_dump().items() if v is not None}\n    code, resp =\
    \ _ue_http_idx(idx, \"/api/control\", method=\"POST\", body=payload, timeout=8)\n\
    \    if code != 200:\n        raise HTTPException(status_code=code if code >=\
    \ 400 else 502, detail=resp)\n    return resp\n\n\n@app.post(\"/api/ues/{idx}/send-once\"\
    )\ndef api_ue_send_once(idx: int) -> dict:\n    code, resp = _ue_http_idx(idx,\
    \ \"/api/send-once\", method=\"POST\", body={}, timeout=130)\n    if code != 200:\n\
    \        raise HTTPException(status_code=code if code >= 400 else 502, detail=resp)\n\
    \    return resp\n\n\n_slo_lock = threading.Lock()\n_slo = {\n    \"latency_ms\"\
    : None,\n    \"throughput_mbps\": 0.0,\n    \"ues\": {},  # ue_id -> {latency_ms?,\
    \ throughput_mbps}\n}\n\n_ul_lock = threading.Lock()\n_ul_delay_ms: dict[str,\
    \ float] = {}\n_ul_delay_at: dict[str, float] = {}\n_ul_window: deque[tuple[float,\
    \ float]] = deque(maxlen=64)\n\n\ndef _grafana_ue_id(app_name: Any, client_index:\
    \ Any) -> str:\n    if isinstance(app_name, str) and app_name.strip():\n     \
    \   return app_name.strip()\n    try:\n        return f\"slice{SLICE_ID}-physical-ai-client-{int(client_index)}\"\
    \n    except (TypeError, ValueError):\n        return f\"slice{SLICE_ID}-physical-ai-client\"\
    \n\n\ndef _record_ul_latency(ue_id: str, delay_ms: float) -> None:\n    uid =\
    \ str(ue_id or _grafana_ue_id(None, None))\n    now = time.time()\n    with _ul_lock:\n\
    \        _ul_delay_ms[uid] = float(delay_ms)\n        _ul_delay_at[uid] = now\n\
    \        _ul_window.append((now, float(delay_ms)))\n\n\ndef _fresh_ul(now: Optional[float]\
    \ = None) -> tuple[dict[str, float], list[float]]:\n    \"\"\"Uplink delay from\
    \ messages received within LATENCY_STALE_S. Omit otherwise.\"\"\"\n    now = time.time()\
    \ if now is None else now\n    cutoff = now - max(1.0, LATENCY_STALE_S)\n    with\
    \ _ul_lock:\n        for uid in [u for u, ts in _ul_delay_at.items() if ts < cutoff]:\n\
    \            _ul_delay_ms.pop(uid, None)\n            _ul_delay_at.pop(uid, None)\n\
    \        window = [v for ts, v in _ul_window if ts >= cutoff]\n        return\
    \ dict(_ul_delay_ms), window\n\n\ndef _one_way_ms(_ue_id: str, raw_s: float) ->\
    \ float:\n    \"\"\"Radio one-way delay: ``t_recv \u2212 t_send`` in milliseconds.\n\
    \n    Requires NTP-aligned UE host (usrp) and server host (gpu-a40). Negative\n\
    \    values are clock skew, not reverse flight time \u2014 clamp to 0 like IoT.\n\
    \    \"\"\"\n    delay_ms = float(raw_s) * 1000.0\n    if delay_ms < 0:\n    \
    \    return 0.0\n    return delay_ms\n\n\nclass _LatencyProxyHandler(BaseHTTPRequestHandler):\n\
    \    \"\"\"Stamp uplink one-way delay (recv \u2212 t_send) then forward to vLLM.\"\
    \"\"\n\n    protocol_version = \"HTTP/1.1\"\n\n    def log_message(self, fmt:\
    \ str, *args: Any) -> None:\n        return\n\n    def _vllm(self, method: str,\
    \ path: str, body: bytes, headers: dict[str, str]) -> tuple[int, bytes, str]:\n\
    \        hdrs = {\"Content-Type\": headers.get(\"Content-Type\") or \"application/json\"\
    }\n        req = urllib.request.Request(\n            f\"{VLLM_URL}{path}\",\n\
    \            data=body if method not in (\"GET\", \"HEAD\") else None,\n     \
    \       headers=hdrs,\n            method=method,\n        )\n        try:\n \
    \           with urllib.request.urlopen(req, timeout=120) as resp:\n         \
    \       raw = resp.read()\n                ctype = resp.headers.get(\"Content-Type\"\
    ) or \"application/json\"\n                return int(resp.status), raw, ctype\n\
    \        except urllib.error.HTTPError as exc:\n            raw = exc.read()\n\
    \            ctype = (exc.headers.get(\"Content-Type\") if exc.headers else None)\
    \ or \"application/json\"\n            return int(exc.code), raw, ctype\n    \
    \    except urllib.error.URLError as exc:\n            payload = json.dumps({\"\
    error\": {\"message\": f\"vLLM not ready: {exc.reason}\"}}).encode()\n       \
    \     return 503, payload, \"application/json\"\n\n    def _reply(self, code:\
    \ int, raw: bytes, ctype: str) -> None:\n        self.send_response(code)\n  \
    \      self.send_header(\"Content-Type\", ctype)\n        self.send_header(\"\
    Content-Length\", str(len(raw)))\n        self.send_header(\"Connection\", \"\
    close\")\n        self.end_headers()\n        self.wfile.write(raw)\n\n    def\
    \ do_GET(self) -> None:  # noqa: N802\n        path = self.path or \"/\"\n   \
    \     code, raw, ctype = self._vllm(\"GET\", path, b\"\", dict(self.headers))\n\
    \        self._reply(code, raw, ctype)\n\n    def do_POST(self) -> None:  # noqa:\
    \ N802\n        recv = time.time()\n        path = self.path or \"/\"\n      \
    \  try:\n            length = int(self.headers.get(\"Content-Length\") or 0)\n\
    \        except (TypeError, ValueError):\n            length = 0\n        raw_in\
    \ = self.rfile.read(length) if length > 0 else b\"\"\n        fwd = raw_in\n \
    \       t_send = None\n        app_name = self.headers.get(\"X-INA-App-Name\"\
