    \ \"ues\": ues}\n\n\n@app.get(\"/api/ues/{idx}/exchanges\")\ndef api_ue_exchanges(idx:\
    \ int, limit: int = 40) -> dict:\n    code, body = _ue_http_idx(idx, f\"/api/exchanges?limit={int(limit)}\"\
    , timeout=8)\n    if code != 200:\n        raise HTTPException(status_code=code\
