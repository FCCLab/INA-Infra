    \            \"max_tokens\": body.max_tokens,\n        },\n    )\n    if code\
    \ != 200:\n        raise HTTPException(status_code=code if code >= 400 else 502,\
    \ detail=resp)\n    choices = (resp or {}).get(\"choices\") or []\n    text =\
    \ \"\"\n    if choices:\n        text = ((choices[0].get(\"message\") or {}).get(\"\
    content\")) or \"\"\n    return {\"ok\": True, \"text\": text, \"raw\": resp}\n\
    \n\ndef _ue_idx_from_name(name: str) -> Optional[int]:\n    prefix = f\"oai-ue-slice-{SLICE_ID}-client-\"\
    \n    if not name.startswith(prefix):\n        return None\n    try:\n       \
    \ return int(name[len(prefix) :])\n    except ValueError:\n        return None\n\
    \n\ndef _ue_deploy_name(idx: int) -> str:\n    return f\"oai-ue-slice-{SLICE_ID}-client-{idx}\"\
    \n\n\ndef _ue_pod_ip(idx: int) -> Optional[str]:\n    ns = _ns()\n    name = _ue_deploy_name(idx)\n\
    \    code, pods = _k8s(\"GET\", f\"/api/v1/namespaces/{ns}/pods\")\n    if code\
    \ != 200:\n        return None\n    for pod in (pods or {}).get(\"items\") or\
    \ []:\n        labels = (pod.get(\"metadata\") or {}).get(\"labels\") or {}\n\
    \        if (labels.get(\"app.kubernetes.io/name\") or labels.get(\"app\")) !=\
    \ name:\n            continue\n        if (pod.get(\"status\") or {}).get(\"phase\"\
    ) != \"Running\":\n            continue\n        ip = (pod.get(\"status\") or\
    \ {}).get(\"podIP\")\n        if ip:\n            return str(ip)\n    return None\n\
    \n\ndef _ue_upstreams(idx: int) -> list[str]:\n    \"\"\"Query UE console via\
    \ cluster service and Multus IP.\"\"\"\n    ip = _console_ip(idx)\n    svc = f\"\
    oai-ue-slice-{SLICE_ID}-client-{idx}\"\n    ns = _ns()\n    return [\n       \
    \ f\"{svc}.{ns}.svc.cluster.local:8090\",\n        f\"{svc}:8090\",\n        f\"\
    {svc}.{ns}.svc.cluster.local:80\",\n        f\"{svc}:80\",\n        f\"{ip}:8090\"\
    ,\n        f\"{ip}:80\",\n    ]\n\n\ndef _ue_http_idx(\n    idx: int,\n    path:\
    \ str,\n    method: str = \"GET\",\n    body: Optional[dict] = None,\n    timeout:\
    \ int = 8,\n) -> tuple[int, Any]:\n    data = json.dumps(body).encode() if body\
    \ is not None else None\n    headers = {\"Content-Type\": \"application/json\"\
    } if body is not None else {}\n    last_err = \"unreachable\"\n    path = path\
    \ if path.startswith(\"/\") else f\"/{path}\"\n    for host in _ue_upstreams(idx):\n\
    \        url = f\"http://{host}{path}\"\n        req = urllib.request.Request(url,\
    \ data=data, headers=headers, method=method)\n        try:\n            with urllib.request.urlopen(req,\
    \ timeout=timeout) as resp:\n                raw = resp.read().decode() or \"\
    {}\"\n                try:\n                    return resp.status, json.loads(raw)\n\
    \                except json.JSONDecodeError:\n                    return resp.status,\
    \ {\"raw\": raw[:400]}\n        except urllib.error.HTTPError as exc:\n      \
    \      raw = exc.read().decode(errors=\"replace\")\n            try:\n       \
    \         parsed = json.loads(raw) if raw else {}\n            except json.JSONDecodeError:\n\
    \                parsed = {\"message\": raw[:400]}\n            return exc.code,\
    \ parsed\n        except urllib.error.URLError as exc:\n            last_err =\
    \ f\"{host}: {exc.reason}\"\n            continue\n    return 503, {\"detail\"\
    : last_err}\n\n\n@app.get(\"/api/ues\")\ndef api_ues() -> dict:\n    ns = _ns()\n\
    \    code, body = _k8s(\"GET\", f\"/apis/apps/v1/namespaces/{ns}/deployments\"\
    )\n    if code not in (200, 201):\n        raise HTTPException(status_code=502,\
    \ detail=(body or {}).get(\"message\", f\"list deployments failed ({code})\"))\n\
    \    pcode, pods = _k8s(\"GET\", f\"/api/v1/namespaces/{ns}/pods\")\n    pods_by_app:\
    \ dict[str, dict] = {}\n    if pcode == 200:\n        for pod in (pods or {}).get(\"\
    items\") or []:\n            labels = (pod.get(\"metadata\") or {}).get(\"labels\"\
    ) or {}\n            app = labels.get(\"app.kubernetes.io/name\") or labels.get(\"\
    app\") or \"\"\n            if app:\n                pods_by_app[app] = pod\n\
    \    ues = []\n    for dep in (body or {}).get(\"items\") or []:\n        meta\
    \ = dep.get(\"metadata\") or {}\n        name = meta.get(\"name\") or \"\"\n \
    \       idx = _ue_idx_from_name(name)\n        if idx is None:\n            continue\n\
    \        st = (dep.get(\"status\") or {})\n        ready = int(st.get(\"readyReplicas\"\
    ) or 0)\n        desired = int(st.get(\"replicas\") or 1)\n        pod = pods_by_app.get(name)\
    \ or {}\n        phase = (pod.get(\"status\") or {}).get(\"phase\") or \"\"\n\
    \        containers = (pod.get(\"status\") or {}).get(\"containerStatuses\") or\
    \ []\n        sidecar = {c.get(\"name\"): bool(c.get(\"ready\")) for c in containers\
    \ if isinstance(c, dict)}\n        \n        # Query UE runtime status payload\
    \ directly\n        live = None\n        sc, live = _ue_http_idx(idx, \"/api/status\"\
    , timeout=3)\n        live_dict = live if isinstance(live, dict) else {}\n   \
    \     if sc != 200:\n            live = {\"ok\": False, \"http_status\": sc, **live_dict}\n\
    \            \n        # Discover Console IP and MAC strictly from the UE client\
    \ payload\n        ip = str(live_dict.get(\"console_ip\") or live_dict.get(\"\
    ip\") or live_dict.get(\"multus_ip\") or \"\").strip()\n        if not ip:\n \
    \           ip = _console_ip(idx)\n        raw_mac = str(live_dict.get(\"console_mac\"\
    ) or live_dict.get(\"mac\") or \"\").strip()\n        mac = raw_mac.replace(\"\
    -\", \":\") if raw_mac else _console_mac(idx)\n\n        multus_url = _http_url(ip)\
    \ if ip else f\"http://{_console_ip(idx)}:80\"\n        ues.append(\n        \
    \    {\n                \"name\": name,\n                \"client_index\": idx,\n\
    \                \"ready\": ready,\n                \"desired\": desired,\n  \
    \              \"pod_phase\": phase,\n                \"sidecars\": sidecar,\n\
    \                \"console_ip\": ip,\n                \"console_mac\": mac,\n\
    \                \"console_url\": multus_url,\n                \"dashboard_url\"\
    : multus_url,\n                \"connected\": (ready >= 1) or (phase == \"Running\"\
