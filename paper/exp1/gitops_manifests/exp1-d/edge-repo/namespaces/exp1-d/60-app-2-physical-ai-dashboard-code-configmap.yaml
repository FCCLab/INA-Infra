    \ scrape is 1s).\nLATENCY_STALE_S = float(os.environ.get(\"LATENCY_STALE_S\",\
    \ \"2.5\"))\n\n\ndef _http_url(host: str, port: int = UE_CONSOLE_PORT) -> str:\n\
    \    if port == 80:\n        return f\"http://{host}/\"\n    return f\"http://{host}:{port}/\"\
    \n\napp = FastAPI(title=\"Physical AI console\", docs_url=\"/api/docs\")\n\n\n\
    class TokenIn(BaseModel):\n    token: str = Field(..., min_length=1)\n\n\nclass\
    \ ChatIn(BaseModel):\n    prompt: str = Field(..., min_length=1)\n    max_tokens:\
    \ int = Field(128, ge=1, le=2048)\n\n\nclass UeControlIn(BaseModel):\n    send_enabled:\
    \ Optional[bool] = None\n    include_image: Optional[bool] = None\n\n\ndef _console_ip(idx:\
    \ int) -> str:\n    return f\"10.1.137.{UE_CONSOLE_OCTET_BASE + (SLICE_ID - 1)\
