apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-udr-controller
  namespace: exp1-d
  labels:
    app.kubernetes.io/name: oai-udr
    app.kubernetes.io/part-of: ina-infra
    app.kubernetes.io/component: oai-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-udr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-udr
    spec:
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      containers:
      - name: udr-controller
        image: docker.io/arorasagar/oai-udr-controller:v2.0.1
        imagePullPolicy: Always
        env:
        - name: NF_TYPE
          value: udr
        - name: DEPLOYMENT_FETCH_INTERVAL
          value: '1'
        - name: DEPLOYMENT_FETCH_ITERATIONS
          value: '100'
        - name: NF_CONF_PATH
          value: /tmp/nf/udr.yaml
        - name: OP_CONF_PATH
          value: /tmp/op/udr.yaml
        - name: TESTING
          value: 'no'
        - name: KUBERNETES_BASE_URL
          value: https://$(KUBERNETES_SERVICE_HOST):$(KUBERNETES_SERVICE_PORT)
        - name: SVC_TYPE
          value: ClusterIP
        volumeMounts:
        - mountPath: /tmp/op
          name: opconf
        - mountPath: /tmp/nf
          name: nfconf
        - name: utils-patch
          mountPath: /root/.local/utils.py
          subPath: utils.py
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 50m
        command:
        - /usr/local/bin/python
        - /root/.local/bin/kopf
        - run
        - /root/.local/controller.py
        - --namespace=ina-infra
      volumes:
      - configMap:
          name: oai-udr-op-conf
        name: opconf
      - configMap:
          name: oai-udr-nf-conf
        name: nfconf
      - name: utils-patch
        configMap:
          name: oai-udr-controller-utils
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      serviceAccountName: oai-udr-operator
      terminationGracePeriodSeconds: 5
      nodeSelector:
        kubernetes.io/arch: amd64
