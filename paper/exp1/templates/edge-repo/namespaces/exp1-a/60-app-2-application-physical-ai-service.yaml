apiVersion: v1
kind: Service
metadata:
  name: application-physical-ai
  namespace: exp1-a
  labels: &id001
    app.kubernetes.io/name: application-physical-ai
    app.kubernetes.io/part-of: ina-infra
    ina.lab/slice: '2'
    ina.lab/app-type: physical_ai
    ina.lab/role: server
spec:
  type: NodePort
  selector: *id001
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: 32080
  - name: dashboard
    port: 80
    targetPort: 80
    nodePort: 32082
  - name: metrics
    port: 8002
    targetPort: 8002
    nodePort: 32083
