apiVersion: v1
kind: ServiceAccount
metadata:
  name: application-cpu-offload
  namespace: exp4-s1
---
apiVersion: v1
kind: Service
metadata:
  name: application-cpu-offload
  namespace: exp4-s1
  labels:
    app.kubernetes.io/name: application-cpu-offload
    ina.lab/slice: '4'
spec:
  selector:
    app.kubernetes.io/name: application-cpu-offload
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-cpu-offload
  namespace: exp4-s1
  labels: &id001
    app.kubernetes.io/name: application-cpu-offload
    app.kubernetes.io/part-of: exp4
    ina.lab/slice: '4'
    ina.lab/app-type: cpu-offload
    ina.lab/role: server
    ina.lab/scheme: exp4-s1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name": "app-slice4-multus", "interface": "net1", "ips": ["10.1.137.214/24"], "gateways": ["10.1.137.1"], "mac": "02:0a:89:a0:00:04"}]'
    spec:
      serviceAccountName: application-cpu-offload
      nodeSelector:
        kubernetes.io/arch: amd64
        ina-infra.nephio.lab/multus-master: enp7s0
      initContainers:
      - name: multus-default-route
        image: docker.io/nicolaka/netshoot
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        command: ["bash", "-c", "set -euo pipefail\nIFACE="net1"\nIP="10.1.137.214"\nGW="10.1.137.1"\nfor _ in $(seq 1 40); do\n  ip link show "$IFACE" >/dev/null 2>&1 && break\n  sleep 1\ndone\nip link show "$IFACE"\nip route replace 10.1.137.0/24 dev "$IFACE" || true\nip route replace 10.1.137.0/24 dev "$IFACE" table 137 || true\nip route replace default via "$GW" dev "$IFACE" table 137 || true\nip rule del from "$IP"/32 table 137 2>/dev/null || true\nip rule add from "$IP"/32 table 137 priority 100\n"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
      containers:
      - name: pipeline
        image: docker.io/library/python:3.12-slim
        imagePullPolicy: IfNotPresent
        env:
        - name: INFLUXDB_URL
          value: http://10.1.137.104:8086
        - name: INFLUXDB_TOKEN
          value: ina-infra-influxdb-token
        - name: INFLUXDB_ORG
          value: ina-infra
        - name: INFLUXDB_BUCKET
          value: default
        - name: INFLUXDB_MEASUREMENT
          value: application_metrics
        - name: SLICE_ID
          value: "4"
        - name: EXP4_APP_TYPE
          value: exp4-s4
        - name: APP_TYPE
          value: exp4-s4
        - name: APP_NAME
          value: application-cpu-offload
        - name: SCHEME_ID
          value: exp4-s1
        - name: E2E_PROBE_HOST
          value: 10.140.4.2
        - name: TO_CLIENT_IFACE
          value: "net1"
        - name: CONSOLE_IFACE
          value: "eth0"
        - name: TARGET_CLUSTER
          value: central
        command: ["bash", "-c", "python3 /app/influx_publish.py & exec python3 /app/server.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /app/server.py
          subPath: server.py
        - name: code
          mountPath: /app/influx_publish.py
          subPath: influx_publish.py
        resources:
          requests:
            cpu: "2.0"
            memory: 1Gi
          limits:
            cpu: "2.0"
            memory: 1Gi
      volumes:
      - name: code
        configMap:
          name: application-cpu-offload-code
