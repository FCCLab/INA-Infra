apiVersion: v1
kind: ServiceAccount
metadata:
  name: application-iperf-sftp
  namespace: exp4-s3
---
apiVersion: v1
kind: Service
metadata:
  name: application-iperf-sftp
  namespace: exp4-s3
  labels:
    app.kubernetes.io/name: application-iperf-sftp
    ina.lab/slice: '1'
spec:
  selector:
    app.kubernetes.io/name: application-iperf-sftp
  ports:
  - name: iperf
    port: 5201
    targetPort: 5201
  - name: sftp
    port: 22
    targetPort: 22
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-iperf-sftp
  namespace: exp4-s3
  labels: &id001
    app.kubernetes.io/name: application-iperf-sftp
    app.kubernetes.io/part-of: exp4
    ina.lab/slice: '1'
    ina.lab/app-type: iperf-sftp
    ina.lab/role: server
    ina.lab/scheme: exp4-s3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name": "app-slice1-multus", "interface": "net1", "ips": ["10.1.137.211/24"], "gateways": ["10.1.137.1"], "mac": "02:0a:89:a0:00:01"}]'
    spec:
      serviceAccountName: application-iperf-sftp
      nodeSelector:
        kubernetes.io/arch: amd64
        ina-infra.nephio.lab/multus-master: enp7s0
      initContainers:
      - name: multus-default-route
        image: docker.io/nicolaka/netshoot
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        command: ["bash", "-c", "set -euo pipefail\nIFACE="net1"\nIP="10.1.137.211"\nGW="10.1.137.1"\nfor _ in $(seq 1 40); do\n  ip link show "$IFACE" >/dev/null 2>&1 && break\n  sleep 1\ndone\nip link show "$IFACE"\nip route replace 10.1.137.0/24 dev "$IFACE" || true\nip route replace 10.1.137.0/24 dev "$IFACE" table 137 || true\nip route replace default via "$GW" dev "$IFACE" table 137 || true\nip rule del from "$IP"/32 table 137 2>/dev/null || true\nip rule add from "$IP"/32 table 137 priority 100\n"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
      - name: make-sftp-payload
        image: docker.io/nicolaka/netshoot
        imagePullPolicy: IfNotPresent
        command: ["bash", "-c", "dd if=/dev/urandom of=/home/ina/download/exp4-5mb.bin bs=1M count=5 status=none && chmod 644 /home/ina/download/exp4-5mb.bin"]
        volumeMounts:
        - name: payload
          mountPath: /home/ina/download
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
      containers:
      - name: iperf
        image: docker.io/networkstatic/iperf3:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: INFLUXDB_URL
          value: http://10.1.137.104:8086
        - name: INFLUXDB_TOKEN
          value: ina-infra-influxdb-token
        - name: INFLUXDB_ORG
          value: ina-infra
        - name: INFLUXDB_BUCKET
          value: default
        - name: INFLUXDB_MEASUREMENT
          value: application_metrics
        - name: SLICE_ID
          value: "1"
        - name: EXP4_APP_TYPE
          value: exp4-s1
        - name: APP_TYPE
          value: exp4-s1
        - name: APP_NAME
          value: application-iperf-sftp
        - name: SCHEME_ID
          value: exp4-s3
        - name: E2E_PROBE_HOST
          value: 10.140.1.2
        - name: TO_CLIENT_IFACE
          value: "net1"
        - name: CONSOLE_IFACE
          value: "eth0"
        - name: TARGET_CLUSTER
          value: central
        args: ["-s", "-p", "5201"]
        ports:
        - containerPort: 5201
        resources:
          requests:
            cpu: "0.5"
            memory: 256Mi
          limits:
            cpu: "0.5"
            memory: 256Mi
      - name: sftp
        image: docker.io/atmoz/sftp:alpine
        imagePullPolicy: IfNotPresent
        args: ["ina:ina:1001::download"]
        ports:
        - containerPort: 22
        volumeMounts:
        - name: payload
          mountPath: /home/ina/download
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
      volumes:
      - name: payload
        emptyDir: {}
