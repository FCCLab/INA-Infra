apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-cu-cp
  namespace: oai-ran-cucp
  labels:
    app.kubernetes.io/name: oai-cu-cp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-cu-cp
  template:
    metadata:
      labels:
        app: oai-cu-cp-cp
        app.kubernetes.io/name: oai-cu-cp
      annotations:
        k8s.v1.cni.cncf.io/networks: "[\n {\n  \"name\": \"cucp-regional-e1\",\n \
          \ \"interface\": \"e1\",\n  \"ips\": [\"172.4.0.252/24\"],\n  \"gateways\"\
          : [\"172.4.0.1\"]\n },\n {\n  \"name\": \"cucp-regional-f1c\",\n  \"interface\"\
          : \"f1c\",\n  \"ips\": [\"172.5.0.252/24\"],\n  \"gateways\": [\"172.5.0.1\"\
          ]\n },\n {\n  \"name\": \"cucp-regional-n2\",\n  \"interface\": \"n2\",\n\
          \  \"ips\": [\"10.1.138.127/24\"],\n  \"gateways\": [\"10.1.138.1\"]\n }\n\
          ]"
    spec:
      serviceAccountName: oai-cu-cp-sa
      terminationGracePeriodSeconds: 5
      containers:
      - name: cucp
        image: docker.io/oaisoftwarealliance/oai-gnb:v2.3.0
        securityContext:
          privileged: true
        env:
        - name: TZ
          value: Europe/Paris
        - name: USE_ADDITIONAL_OPTIONS
          value: --sa --log_config.global_log_options level,nocolor,time
        - name: USE_VOLUMED_CONF
          value: 'yes'
        ports:
        - name: n2
          containerPort: 36412
          protocol: SCTP
        - name: e1
          containerPort: 38462
          protocol: SCTP
        - name: f1c
          containerPort: 38472
          protocol: UDP
        volumeMounts:
        - name: configuration
          mountPath: /opt/oai-gnb/etc/gnb.conf
          subPath: gnb.conf
      volumes:
      - name: configuration
        configMap:
          name: oai-cu-cp-configmap
