apiVersion: apps/v1
kind: Deployment
metadata:
  name: node0-bulk-binder
  namespace: local-bulk
  labels:
    app.kubernetes.io/name: node0-bulk-binder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: node0-bulk-binder
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node0-bulk-binder
    spec:
      nodeSelector:
        kubernetes.io/hostname: regional-0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: bulk
              mountPath: /data
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: bulk
          persistentVolumeClaim:
            claimName: node0-bulk
