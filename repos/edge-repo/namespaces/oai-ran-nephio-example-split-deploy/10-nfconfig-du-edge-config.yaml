apiVersion: workload.nephio.org/v1alpha1
kind: NFConfig
metadata:
  name: du-edge-config
  namespace: oai-ran-nephio-example-split-deploy
spec:
  configRefs:
  - apiVersion: workload.nephio.org/v1alpha1
    kind: RANConfig
    metadata:
      name: ranconfig
      namespace: oai-ran-nephio-example-split-deploy
    spec:
      cellIdentity: 12345678
      physicalCellID: 0
      tac: 1
      downlinkFrequencyBand: 78
      downlinkSubCarrierSpacing: 1
      downlinkCarrierBandwidth: 51
      uplinkFrequencyBand: 78
      uplinkSubCarrierSpacing: 1
      uplinkCarrierBandwidth: 51
  - apiVersion: workload.nephio.org/v1alpha1
    kind: PLMN
    metadata:
      name: plmn
      namespace: oai-ran-nephio-example-split-deploy
    spec:
      PLMNInfo:
      - plmnID:
          mcc: '001'
          mnc: '01'
        tac: 1
        nssai:
        - sd: ffffff
          sst: 1
  - apiVersion: workload.nephio.org/v1alpha1
    kind: OAIConfig
    metadata:
      name: oai-nf-config
      namespace: oai-ran-nephio-example-split-deploy
    spec:
      image: docker.io/oaisoftwarealliance/oai-gnb:v2.3.0
