apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: oai-ran-nephio-example-split-deploy
  name: oai-ran-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-ran-operator
      app.kubernetes.io/component: controller
  template:
    metadata:
      name: oai-ran-operator
      labels:
        app.kubernetes.io/name: oai-ran-operator
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: oai-ran-operator
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - edge-0
                - edge-1
      containers:
      - name: operator
        image: docker.io/nephio/oai-ran-controller:latest
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
