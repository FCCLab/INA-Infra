apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-operator-node-feature-discovery-master
  namespace: gpu-operator
  labels:
    helm.sh/chart: node-feature-discovery-0.18.3
    app.kubernetes.io/name: node-feature-discovery
    app.kubernetes.io/instance: gpu-operator
    app.kubernetes.io/version: v0.18.3
    app.kubernetes.io/managed-by: Helm
    role: master
spec:
  replicas: 1
  revisionHistoryLimit: null
  selector:
    matchLabels:
      app.kubernetes.io/name: node-feature-discovery
      app.kubernetes.io/instance: gpu-operator
      role: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-feature-discovery
        app.kubernetes.io/instance: gpu-operator
        role: master
      annotations:
        checksum/config: 4c75beab900dd5a0d37d2f52bab62d584835356434381fb0661f828a03b5935d
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      imagePullSecrets: null
      serviceAccountName: node-feature-discovery
      enableServiceLinks: false
      securityContext: {}
      hostNetwork: false
      containers:
      - name: master
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        image: registry.k8s.io/nfd/node-feature-discovery:v0.18.3
        imagePullPolicy: IfNotPresent
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 10
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        command:
        - nfd-master
        resources:
          limits:
            memory: 4Gi
          requests:
            cpu: 100m
            memory: 128Mi
        args:
        - -enable-leader-election
        - -feature-gates=NodeFeatureGroupAPI=false
        - -port=8080
        volumeMounts:
        - name: nfd-master-conf
          mountPath: /etc/kubernetes/node-feature-discovery
          readOnly: true
      volumes:
      - name: nfd-master-conf
        configMap:
          name: gpu-operator-node-feature-discovery-master-conf
          items:
          - key: nfd-master.conf
            path: nfd-master.conf
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: In
                values:
                - ''
            weight: 1
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: ''
