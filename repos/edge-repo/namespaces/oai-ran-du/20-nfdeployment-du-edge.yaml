apiVersion: workload.nephio.org/v1alpha1
kind: NFDeployment
metadata:
  name: du-edge
  namespace: oai-ran-du
spec:
  provider: du.openairinterface.org
  interfaces:
  - name: f1
    ipv4:
      address: 172.5.0.253/24
      gateway: 172.5.0.1
    vlanID: 5
  networkInstances:
  - name: vpc-cudu-f1
    interfaces:
    - f1
  parametersRefs:
  - name: du-edge-config
    apiVersion: workload.nephio.org/v1alpha1
    kind: NFConfig
  - name: du-edge-cucp-regional
    apiVersion: ref.nephio.org/v1alpha1
    kind: Config
