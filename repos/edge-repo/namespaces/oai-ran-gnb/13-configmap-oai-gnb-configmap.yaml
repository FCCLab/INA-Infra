apiVersion: v1
kind: ConfigMap
metadata:
  name: oai-gnb-configmap
  namespace: oai-ran-gnb
data:
  gnb.conf: "Active_gNBs = ( \"oai-gnb\");\nAsn1_verbosity = \"none\";\ngNBs =\n(\n\
    \ {\n    gNB_ID = 0xe00;\n    gNB_name  =  \"oai-gnb\";\n    tracking_area_code\
    \  =  1;\n    plmn_list = ({ mcc = 001; mnc = 01; mnc_length = 2; snssaiList =\
    \ ({ sst = 1, sd = 0xffffff }) });\n    nr_cellid = 12345678;\n    min_rxtxtime\
    \ = 6;\n    servingCellConfigCommon = (\n    {\n      absoluteFrequencySSB = 640704;\n\
    \      dl_frequencyBand = 78;\n      dl_absoluteFrequencyPointA = 639996;\n  \
    \    dl_offstToCarrier = 0;\n      dl_subcarrierSpacing = 1;\n      dl_carrierBandwidth\
    \ = 51;\n      initialDLBWPlocationAndBandwidth = 13750;\n      initialDLBWPsubcarrierSpacing\
    \ = 1;\n      initialDLBWPcontrolResourceSetZero = 12;\n      initialDLBWPsearchSpaceZero\
    \ = 0;\n      ul_frequencyBand = 78;\n      ul_offstToCarrier = 0;\n      ul_subcarrierSpacing\
    \ = 1;\n      ul_carrierBandwidth = 51;\n      pMax = 20;\n      initialULBWPlocationAndBandwidth\
    \ = 13750;\n      initialULBWPsubcarrierSpacing = 1;\n      prach_ConfigurationIndex\
    \ = 98;\n      prach_msg1_FDM = 0;\n      prach_msg1_FrequencyStart = 0;\n   \
    \   zeroCorrelationZoneConfig = 13;\n      preambleReceivedTargetPower = -96;\n\
    \      preambleTransMax = 6;\n      powerRampingStep = 1;\n      ra_ResponseWindow\
    \ = 4;\n      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR = 4;\n      ssb_perRACH_OccasionAndCB_PreamblesPerSSB\
    \ = 14;\n      ra_ContentionResolutionTimer = 7;\n      rsrp_ThresholdSSB = 19;\n\
    \      prach_RootSequenceIndex_PR = 2;\n      prach_RootSequenceIndex = 1;\n \
    \     msg1_SubcarrierSpacing = 1,\n      restrictedSetConfig = 0,\n      msg3_DeltaPreamble\
    \ = 1;\n      p0_NominalWithGrant =-90;\n      pucchGroupHopping = 0;\n      hoppingId\
    \ = 40;\n      p0_nominal = -90;\n      ssb_PositionsInBurst_Bitmap = 1;\n   \
    \   ssb_periodicityServingCell = 2;\n      dmrs_TypeA_Position = 0;\n      subcarrierSpacing\
    \ = 1;\n      referenceSubcarrierSpacing = 1;\n      dl_UL_TransmissionPeriodicity\
    \ = 6;\n      nrofDownlinkSlots = 7;\n      nrofDownlinkSymbols = 6;\n      nrofUplinkSlots\
    \ = 2;\n      nrofUplinkSymbols = 4;\n      ssPBCH_BlockPower = -25;\n     }\n\
    \  );\n    SCTP :\n    {\n        SCTP_INSTREAMS  = 2;\n        SCTP_OUTSTREAMS\
    \ = 2;\n    };\n\n    amf_ip_address      = ( { ipv4       = \"10.1.139.10\";\
    \ } );\n\n    NETWORK_INTERFACES :\n    {\n        GNB_IPV4_ADDRESS_FOR_NG_AMF\
    \              = \"10.1.139.113\";\n        GNB_IPV4_ADDRESS_FOR_NGU         \
    \        = \"10.1.139.113\";\n        GNB_PORT_FOR_S1U                       \
    \  = 2152;\n    };\n  }\n);\n\nMACRLCs = (\n  {\n    num_cc = 1;\n    tr_s_preference\
    \ = \"local_L1\";\n    tr_n_preference = \"local_RRC\";\n  }\n);\n\nL1s = (\n\
    {\n  num_cc = 1;\n  tr_n_preference = \"local_mac\";\n  prach_dtx_threshold =\
    \ 200;\n  pucch0_dtx_threshold = 150;\n  ofdm_offset_divisor = 8;\n}\n);\n\nRUs\
    \ = (\n    {\n    local_rf = \"yes\"\n    nb_tx = 1\n    nb_rx = 1\n    att_tx\
    \ = 0\n    att_rx = 0;\n    bands = [78];\n    max_pdschReferenceSignalPower =\
    \ -27;\n    max_rxgain = 114;\n    eNB_instances = [0];\n    bf_weights = [0x00007fff,\
    \ 0x0000, 0x0000, 0x0000];\n    clock_src = \"internal\";\n    }\n);\n\nTHREAD_STRUCT\
    \ = (\n  {\n    parallel_config = \"PARALLEL_SINGLE_THREAD\";\n    worker_config\
    \ = \"WORKER_ENABLE\";\n  }\n);\nrfsimulator: {\n    serveraddr = \"server\";\n\
    \    serverport = \"4043\";\n    options = ();\n    modelname = \"AWGN\";\n  \
    \  IQfile = \"/tmp/rfsimulator.iqs\"\n}\n\nlog_config :\n{\n    global_log_level\
    \ = \"info\";\n    hw_log_level = \"info\";\n    phy_log_level = \"info\";\n \
    \   mac_log_level = \"info\";\n    rlc_log_level = \"info\";\n    f1ap_log_level\
    \ = \"info\";\n    rrc_log_level = \"info\";\n    ngap_log_level = \"debug\";\n\
    };\n"
