apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-ue-1
  namespace: oai-slice-deployment
  labels:
    app.kubernetes.io/name: oai-ue-1
    slice: '1'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-ue-1
  template:
    metadata:
      labels:
        app: oai-ue-1
        app.kubernetes.io/name: oai-ue-1
        slice: '1'
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name": "ue1-sim-rf", "interface": "rf", "ips":
          ["10.1.139.115/24"], "gateways": ["10.1.139.1"]}]'
    spec:
      serviceAccountName: oai-ue-1-sa
      terminationGracePeriodSeconds: 5
      nodeSelector:
        kubernetes.io/hostname: usrp
      containers:
      - name: ue
        image: 10.1.132.30:5000/oai-nr-ue:nws-v0.5-amd64
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: USE_ADDITIONAL_OPTIONS
          value: -r 133 --numerology 1 -C 3325620000 --ssb 144 --rfsim --log_config.global_log_options
            level,nocolor,time --rfsimulator.serveraddr 10.1.139.114
        - name: TZ
          value: Europe/Paris
        volumeMounts:
        - name: configuration
          mountPath: /opt/oai-nr-ue/etc/nr-ue.conf
          subPath: ue.conf
      - name: debug
        image: docker.io/nicolaka/netshoot
        command:
        - sleep
        - infinity
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      - name: slicea-publisher
        image: 10.1.132.30:5000/slicea-publisher:nws-v0.5-amd64
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        env:
        - name: VIDEO_SOURCE
          value: /data/example.mp4
        - name: RTSP_TARGET_HOST
          value: 10.1.132.210
        - name: RTSP_PORT
          value: '8554'
        - name: STREAM_PATH
          value: slicea
        - name: RTSP_PROTOCOL
          value: tcp
        - name: METRICS_PORT
          value: '9101'
        - name: METRICS_ADDR
          value: 0.0.0.0
        - name: LOG_INTERVAL_S
          value: '1'
        - name: PDU_IFACE
          value: oaitun_ue1
        - name: PDU_ROUTE_HOSTS
          value: 10.1.132.210
        ports:
        - name: metrics
          containerPort: 9101
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
      volumes:
      - name: configuration
        configMap:
          name: oai-ue-1-configmap
