apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-ue-4
  namespace: oai-slice-deployment
  labels:
    app.kubernetes.io/name: oai-ue-4
    slice: '4'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-ue-4
  template:
    metadata:
      labels:
        app: oai-ue-4
        app.kubernetes.io/name: oai-ue-4
        slice: '4'
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name": "ue4-sim-rf", "interface": "rf", "ips":
          ["10.1.139.118/24"], "gateways": ["10.1.139.1"]}]'
    spec:
      serviceAccountName: oai-ue-4-sa
      terminationGracePeriodSeconds: 5
      nodeSelector:
        kubernetes.io/hostname: usrp
      containers:
      - name: ue
        image: 10.1.132.30:5000/oai-nr-ue:nws-v0.5-amd64
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: USE_ADDITIONAL_OPTIONS
          value: -r 133 --numerology 1 -C 3325620000 --ssb 144 --rfsim --log_config.global_log_options
            level,nocolor,time --rfsimulator.serveraddr 10.1.139.114
        - name: TZ
          value: Europe/Paris
        volumeMounts:
        - name: configuration
          mountPath: /opt/oai-nr-ue/etc/nr-ue.conf
          subPath: ue.conf
      - name: debug
        image: docker.io/nicolaka/netshoot
        command:
        - sleep
        - infinity
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      - name: sliced-client
        image: 10.1.132.30:5000/sliced-client:nws-v0.5-amd64
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        env:
        - name: BROKER_HOST
          value: 10.1.132.210
        - name: BROKER_PORT
          value: '1883'
        - name: OTA_BIND_IP
          value: ''
        - name: METRICS_BIND_IP
          value: 0.0.0.0
        - name: METRICS_PORT
          value: '9104'
        - name: NUM_DEVICES
          value: '5'
        - name: FAST_PERIOD_S
          value: '60'
        - name: MED_PERIOD_S
          value: '1800'
        - name: SLOW_PERIOD_S
          value: '3600'
        - name: MQTT_QOS
          value: '0'
        - name: LOG_INTERVAL_S
          value: '30'
        - name: LOG_LEVEL
          value: INFO
        - name: PDU_IFACE
          value: oaitun_ue1
        - name: PDU_ROUTE_HOSTS
          value: 10.1.132.210
        ports:
        - name: metrics
          containerPort: 9104
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      volumes:
      - name: configuration
        configMap:
          name: oai-ue-4-configmap
