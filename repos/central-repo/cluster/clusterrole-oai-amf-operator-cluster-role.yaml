apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oai-amf-operator-cluster-role
rules:
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  resourceNames:
  - anyuid
  verbs:
  - use
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ref.nephio.org
  resources:
  - configs
  - config
  verbs:
  - list
  - watch
  - update
  - patch
  - get
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - get
  - create
  - delete
  - patch
- apiGroups:
  - workload.nephio.org
  resources:
  - nfdeployments
  - nfdeployments/status
  - nfconfigs
  - nfdeployments/finalizers
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  - serviceaccounts
  - configmaps
  - services
  - services/finalizers
  - serviceaccounts/finalizers
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  - extensions
  resources:
  - deployments
  - deployments/status
  - deployments/finalizers
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - k8s.cni.cncf.io
  resources:
  - network-attachment-definitions
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io/v1
  - admissionregistration.k8s.io/v1beta1
  resources:
  - validatingwebhookconfigurations
  - mutatingwebhookconfigurations
  verbs:
  - create
  - patch
