apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: NodePort
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
      nodePort: 30909
  selector:
    app.kubernetes.io/name: prometheus
