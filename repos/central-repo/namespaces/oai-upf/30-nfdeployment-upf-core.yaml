apiVersion: workload.nephio.org/v1alpha1
kind: NFDeployment
metadata:
  name: upf-core
  namespace: oai-upf
spec:
  provider: upf.openairinterface.org
  capacity:
    maxDownlinkThroughput: 5G
    maxUplinkThroughput: 5G
  parametersRefs:
  - name: upf-core-config
    apiVersion: workload.nephio.org/v1alpha1
    kind: NFConfig
  interfaces:
  - name: n3
    ipv4:
      address: 10.1.139.11/24
      gateway: 10.1.139.1
    vlanID: 4
  - name: n4
    ipv4:
      address: 10.1.139.13/24
      gateway: 10.1.139.1
    vlanID: 2
  - name: n6
    ipv4:
      address: 10.1.139.14/24
      gateway: 10.1.139.1
    vlanID: 3
  networkInstances:
  - name: vpc-internal
    interfaces:
    - n4
  - name: vpc-internet
    dataNetworks:
    - name: internet
      pool:
      - prefix: 10.1.0.0/24
    interfaces:
    - n6
  - name: vpc-ran
    interfaces:
    - n3
