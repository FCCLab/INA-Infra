apiVersion: workload.nephio.org/v1alpha1
kind: NFDeployment
metadata:
  name: upf-slice-1
  namespace: oai-upf
  annotations:
    force-reconcile: smf-nrf-ip-20260727
spec:
  provider: upf.openairinterface.org
  capacity:
    maxDownlinkThroughput: 5G
    maxUplinkThroughput: 5G
  parametersRefs:
  - name: upf-slice-1-config
    apiVersion: workload.nephio.org/v1alpha1
    kind: NFConfig
  interfaces:
  - name: n3
    ipv4:
      address: 10.1.139.20/24
      gateway: 10.1.139.1
    vlanID: 4
  - name: n4
    ipv4:
      address: 10.1.139.21/24
      gateway: 10.1.139.1
    vlanID: 2
  - name: n6
    ipv4:
      address: 10.1.139.22/24
      gateway: 10.1.139.1
    vlanID: 3
  networkInstances:
  - name: vpc-internal
    interfaces:
    - n4
  - name: vpc-internet
    dataNetworks:
    - name: oai1
      pool:
      - prefix: 10.1.1.0/24
    interfaces:
    - n6
  - name: vpc-ran
    interfaces:
    - n3
