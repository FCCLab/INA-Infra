apiVersion: workload.nephio.org/v1alpha1
kind: NFDeployment
metadata:
  name: smf-core
  namespace: oai-cn
spec:
  provider: smf.openairinterface.org
  capacity:
    maxNFConnections: 5
    maxSessions: 500
  interfaces:
  - name: n4
    ipv4:
      address: 172.1.1.254/24
      gateway: 172.1.1.1
    vlanID: 2
  networkInstances:
  - name: vpc-internal
    interfaces:
    - n4
  parametersRefs:
  - name: smf-core-config
    apiVersion: workload.nephio.org/v1alpha1
    kind: NFConfig
  - name: smf-core-upf-core
    apiVersion: ref.nephio.org/v1alpha1
    kind: Config
