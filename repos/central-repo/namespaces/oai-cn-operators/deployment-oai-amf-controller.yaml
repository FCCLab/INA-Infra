apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-amf-controller
  namespace: oai-cn-operators
  labels:
    app.kubernetes.io/name: oai-amf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-amf
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-amf
    spec:
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      containers:
      - name: amf-controller
        image: docker.io/arorasagar/oai-amf-controller:v2.0.1
        imagePullPolicy: Always
        env:
        - name: NF_TYPE
          value: amf
        - name: DEPLOYMENT_FETCH_INTERVAL
          value: '1'
        - name: DEPLOYMENT_FETCH_ITERATIONS
          value: '100'
        - name: NF_CONF_PATH
          value: /tmp/nf/amf.yaml
        - name: OP_CONF_PATH
          value: /tmp/op/amf.yaml
        - name: TESTING
          value: 'no'
        - name: KUBERNETES_BASE_URL
          value: https://kubernetes.default.svc
        volumeMounts:
        - mountPath: /tmp/op
          name: opconf
        - mountPath: /tmp/nf
          name: nfconf
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 100m
      volumes:
      - configMap:
          name: oai-amf-op-conf
        name: opconf
      - configMap:
          name: oai-amf-nf-conf
        name: nfconf
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      serviceAccountName: oai-amf-operator
      terminationGracePeriodSeconds: 5
