apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-nrf-controller
  namespace: oai-cn-operators
  labels:
    app.kubernetes.io/name: oai-nrf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-nrf
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-nrf
    spec:
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      imagePullSecrets:
      - name: regcred
      containers:
      - name: nrf-controller
        image: docker.io/arorasagar/oai-nrf-controller:v2.0.1
        imagePullPolicy: Always
        env:
        - name: NF_TYPE
          value: nrf
        - name: DEPLOYMENT_FETCH_INTERVAL
          value: '1'
        - name: DEPLOYMENT_FETCH_ITERATIONS
          value: '100'
        - name: SVC_TYPE
          value: LoadBalancer
        - name: NF_CONF_PATH
          value: /tmp/nf/nrf.yaml
        - name: OP_CONF_PATH
          value: /tmp/op/nrf.yaml
        - name: KUBERNETES_BASE_URL
          value: https://kubernetes.default.svc
        volumeMounts:
        - mountPath: /tmp/op
          name: opconf
        - mountPath: /tmp/nf
          name: nfconf
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 50m
      volumes:
      - configMap:
          name: oai-nrf-op-conf
        name: opconf
      - configMap:
          name: oai-nrf-nf-conf
        name: nfconf
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      serviceAccountName: oai-nrf-operator
      terminationGracePeriodSeconds: 5
