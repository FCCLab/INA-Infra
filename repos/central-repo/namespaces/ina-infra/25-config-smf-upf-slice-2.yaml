apiVersion: ref.nephio.org/v1alpha1
kind: Config
metadata:
  name: smf-core-upf-slice-2
  namespace: ina-infra
  labels:
    app.kubernetes.io/part-of: ina-infra
    app.kubernetes.io/component: dedicated-core
    ina-infra.nephio.lab/slice: "2"
spec:
  config:
    apiVersion: workload.nephio.org/v1alpha1
    kind: NFDeployment
    metadata:
      name: upf-slice-2
      namespace: ina-infra
    spec:
      provider: upf.openairinterface.org
      capacity:
        maxDownlinkThroughput: 5G
        maxUplinkThroughput: 5G
      interfaces:
      - name: n3
        ipv4:
          address: 10.1.140.22/24
          gateway: 10.1.140.1
        vlanID: 4
      - name: n4
        ipv4:
          address: 10.1.140.42/24
          gateway: 10.1.140.1
        vlanID: 2
      - name: n6
        ipv4:
          address: 10.1.140.62/24
          gateway: 10.1.140.1
        vlanID: 3
      networkInstances:
      - name: vpc-internal
        interfaces:
        - n4
      - name: vpc-internet
        dataNetworks:
        - name: oai2
          pool:
          - prefix: 10.140.2.0/24
        interfaces:
        - n6
      - name: vpc-ran
        interfaces:
        - n3
