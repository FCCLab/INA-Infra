apiVersion: apps/v1
kind: Deployment
metadata:
  name: sliced-edge
  namespace: oai-slice-deployment
  labels: &id001
    app.kubernetes.io/name: sliced-edge
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: edge
        image: 10.1.132.30:5000/sliced-edge:nws-v0.5-amd64
        imagePullPolicy: IfNotPresent
        env:
        - name: OTA_BIND_IP
          value: 0.0.0.0
        - name: METRICS_BIND_IP
          value: 0.0.0.0
        - name: METRICS_PORT
          value: '9105'
        - name: DL_FAST_PERIOD_S
          value: '300'
        - name: DL_SLOW_PERIOD_S
          value: '3600'
        - name: DL_PAYLOAD_BYTES
          value: '256'
        - name: DEVICE_TTL_S
          value: '7200'
        - name: MQTT_QOS
          value: '0'
        - name: LOG_INTERVAL_S
          value: '30'
        - name: LOG_LEVEL
          value: INFO
        ports:
        - name: mqtt
          containerPort: 1883
        - name: metrics
          containerPort: 9105
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 5
          periodSeconds: 10
      nodeSelector:
        kubernetes.io/arch: amd64
