kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: "{\n    \"nodePathMap\": [\n        {\n            \"node\": \"DEFAULT_PATH_FOR_NON_LISTED_NODES\"\
    ,\n            \"paths\": [\n                \"/opt/local-path-provisioner\"\n\
    \            ]\n        }\n    ]\n}"
  setup: '#!/bin/sh

    set -eu

    mkdir -m 0777 -p "$VOL_DIR"'
  teardown: '#!/bin/sh

    set -eu

    rm -rf "$VOL_DIR"'
  helperPod.yaml: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: helper-pod\nspec:\n\
    \  priorityClassName: system-node-critical\n  tolerations:\n    - key: node.kubernetes.io/disk-pressure\n\
    \      operator: Exists\n      effect: NoSchedule\n  containers:\n  - name: helper-pod\n\
    \    image: docker.io/library/busybox\n    imagePullPolicy: IfNotPresent"
