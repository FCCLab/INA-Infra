apiVersion: v1
kind: Service
metadata:
  name: ina-infra-backend
  namespace: ina-infra
  labels:
    app.kubernetes.io/name: ina-infra-backend
    app.kubernetes.io/part-of: ina-infra
  annotations:
    ina-infra.nephio.lab/backend: host-systemd
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ina-infra-backend
  namespace: ina-infra
  labels:
    app.kubernetes.io/name: ina-infra-backend
    app.kubernetes.io/part-of: ina-infra
subsets:
  - addresses:
      - ip: 10.1.132.200
    ports:
      - name: http
        port: 8082
