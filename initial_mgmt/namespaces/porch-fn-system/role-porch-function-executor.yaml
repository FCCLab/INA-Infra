apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: porch-function-executor
  namespace: porch-fn-system
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - create
  - delete
  - patch
  - get
  - watch
  - list
- apiGroups:
  - ''
  resources:
  - services
  - endpoints
  verbs:
  - create
  - delete
  - get
  - watch
  - list
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - delete
  - update
  - get
- apiGroups:
  - config.porch.kpt.dev
  resources:
  - functionconfigs
  verbs:
  - get
  - list
  - watch
  - patch
- apiGroups:
  - config.porch.kpt.dev
  resources:
  - functionconfigs/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - podtemplates
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - config.porch.kpt.dev
  resources:
  - servicetemplates
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
