apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/managed-by: configmanagement.gke.io
    app.kubernetes.io/name: memcached
  name: gitea-memcached
  namespace: gitea
spec:
  ports:
  - name: memcache
    port: 11211
    protocol: TCP
    targetPort: memcache
  selector:
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/name: memcached
  sessionAffinity: None
  type: ClusterIP
