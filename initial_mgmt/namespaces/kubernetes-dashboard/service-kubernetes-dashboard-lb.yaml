apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.1.132.40
  labels:
    app.kubernetes.io/managed-by: configmanagement.gke.io
  name: kubernetes-dashboard-lb
  namespace: kubernetes-dashboard
spec:
  allocateLoadBalancerNodePorts: false
  ports:
