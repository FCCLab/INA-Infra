apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    configmanagement.gke.io/managed: enabled
    configmanagement.gke.io/source-path: namespaces/porch-system/deployment-porch-server.yaml
    configmanagement.gke.io/token: fa352451d6fec752b063f38b22c05ecb5aeda19c
    configsync.gke.io/git-context: '{"repo":"http://10.1.132.51:3000/nephio/mgmt.git","branch":"main","rev":"HEAD"}'
    configsync.gke.io/manager: :root_mgmt
    configsync.gke.io/resource-id: apps_deployment_porch-system_porch-server
  labels:
    app.kubernetes.io/managed-by: configmanagement.gke.io
    configsync.gke.io/declared-version: v1
  name: porch-server
  namespace: porch-system
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: porch-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: porch-server
    spec:
      containers:
      - args:
        - --function-runner=function-runner:9445
        - --cache-directory=/cache
        - --cert-dir=/tmp/certs
        - --secure-port=4443
        - --repo-operation-retry-attempts=3
        - --max-request-body-size=6291456
        env:
        - name: OTEL_SERVICE_NAME
          value: porch-server
        - name: CERT_STORAGE_DIR
          value: /etc/webhook/certs
        - name: GOOGLE_API_GO_EXPERIMENTAL_DISABLE_NEW_AUTH_LIB
          value: 'true'
        image: docker.io/nephio/porch-server:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 4443
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: porch-server
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 4443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /cache
          name: cache-volume
        - mountPath: /etc/webhook/certs
          name: webhook-certs
        - mountPath: /tmp/certs
          name: api-server-certs
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: porch-server
      serviceAccountName: porch-server
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: cache-volume
      - emptyDir: {}
        name: webhook-certs
      - emptyDir: {}
        name: api-server-certs
