apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: configmanagement.gke.io
  name: api
  namespace: porch-system
spec:
  ports:
  - name: api
    port: 443
    protocol: TCP
    targetPort: 4443
  - name: webhooks
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app: porch-server
  sessionAffinity: None
  type: ClusterIP
