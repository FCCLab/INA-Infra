apiVersion: v1
kind: Service
metadata:
  name: openspeedtest-service
  namespace: default
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.1.132.50
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: openspeedtest
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
