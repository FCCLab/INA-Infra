apiVersion: apps/v1
kind: Deployment
metadata:
  name: nephio-webui
  namespace: nephio-webui
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: nephio-webui
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: nephio-webui
    spec:
      containers:
      - args:
        - --config
        - /etc/config/app-config.nephio.yaml
        env:
        - name: AUTH_PROVIDER
          value: current-context
        - name: AUTH_OIDC_TOKEN_PROVIDER
          value: okta
        image: nephio/kpt-backstage-plugins:latest
        imagePullPolicy: IfNotPresent
        name: main
        ports:
        - containerPort: 7007
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 7007
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/config
          name: config-volume
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: nephio-webui-sa
      serviceAccountName: nephio-webui-sa
      terminationGracePeriodSeconds: 10
      volumes:
      - configMap:
          defaultMode: 420
          name: nephio-webui-config
        name: config-volume
