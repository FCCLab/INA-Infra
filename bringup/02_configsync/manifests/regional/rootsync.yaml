apiVersion: configsync.gke.io/v1beta1
kind: RootSync
metadata:
  name: regional-repo
  namespace: config-management-system
spec:
  sourceFormat: unstructured
  git:
    repo: http://10.1.132.200:3000/nephio/regional-repo.git
    branch: main
    auth: token
    secretRef:
      name: regional-repo-access-token-configsync
    period: 15s
  override:
    statusMode: disabled
    # Don't block sync for long on NFDeployments / DaemonSets that stay non-Ready.
    reconcileTimeout: 30s
