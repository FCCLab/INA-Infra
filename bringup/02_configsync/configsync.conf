# Config Sync bringup — sourced by configsync.sh
# Override via environment or: configsync.sh --config /path/to/other.conf

# mgmt cluster (token secrets stored here)
MGMT_KUBECONFIG="${HOME}/.kube/config"
MGMT_CTX="mgmt@mgmt"

# Gitea (reachable from workload clusters)
GITEA_HOST="10.1.132.200"
GITEA_PORT="3000"
GITEA_ORG="nephio"
GITEA_USER="nephio"
GITEA_PASSWORD="secret"
GIT_BRANCH="main"
TOKEN_NAMESPACE="default"

# manifest paths (relative to bringup/02_configsync/)
OPERATOR_MANIFESTS_DIR="manifests/operator"
CLUSTER_MANIFESTS_DIR="manifests"

# shared operator install order (all clusters)
OPERATOR_MANIFESTS=(
  namespace.yaml
  config-management-operator.yaml
  rootsync-crd.yaml
)

# per-cluster manifests (under manifests/{cluster}/)
CLUSTER_MANIFESTS=(
  reconciler-manager-custom-cm.yaml
  configsync.yaml
  rootsync.yaml
)

# default targets when no cluster args
ALL_CONFIGSYNC_CLUSTERS=(mgmt central regional edge)

# behaviour
REMOTE="1"
SKIP_UNTAINT="0"
POD_READY_TIMEOUT="600s"
