apiVersion: v1
kind: Secret
metadata:
  name: gitea-inline-config
  namespace: gitea
  labels:
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
type: Opaque
stringData:
  _generals_: ""
  cache: |-
    ADAPTER=memcache
    ENABLED=true
    HOST=gitea-memcached.gitea.svc.cluster.local:11211
  database: |-
    DB_TYPE=postgres
    HOST=gitea-postgresql.gitea.svc.cluster.local:5432
    NAME=gitea
    USER=gitea
    PASSWD=secret
  metrics: ENABLED=false
  repository: ROOT=/data/git/gitea-repositories
  security: INSTALL_LOCK=true
  webhook: |-
    ALLOWED_HOST_LIST=*
    SKIP_TLS_VERIFY=true
  server: |-
    APP_DATA_PATH=/data
    DOMAIN=10.1.132.51
    ENABLE_PPROF=false
    HTTP_PORT=3000
    PROTOCOL=http
    ROOT_URL=http://10.1.132.51:3000
    SSH_DOMAIN=10.1.132.51
    SSH_LISTEN_PORT=22
    SSH_PORT=22
