# Gitea platform config — sourced by gitea.sh
# Override any value via environment or: gitea.sh --config /path/to/other.conf

# Kubernetes access (mgmt cluster)
KUBECONFIG="${HOME}/.kube/config"
KUBECONFIG_CONTEXT="mgmt@mgmt"

# Gitea namespace and UI (mgmt control-plane node IP — no MetalLB VIP)
GITEA_HOST="10.1.132.200"
GITEA_PORT="3000"
GITEA_USER="nephio"
GITEA_PASSWORD="secret"

# Manifest directories (relative to gitea/)
GITEA_MANIFESTS_DIR="manifests"
STORAGE_MANIFESTS_DIR="manifests/storage"

# install behaviour
WITH_STORAGE="0"
POD_READY_TIMEOUT="600s"

# Gitea manifests applied in order (under GITEA_MANIFESTS_DIR)
GITEA_MANIFESTS=(
  namespace.yaml
  secret-git-user.yaml
  secret-gitea.yaml
  secret-gitea-init.yaml
  secret-gitea-inline-config.yaml
  secret-postgresql.yaml
  service-gitea.yaml
  service-memcached.yaml
  service-postgresql.yaml
  service-postgresql-hl.yaml
  deployment-memcached.yaml
  statefulset-postgres.yaml
  statefulset-gitea.yaml
)

STORAGE_MANIFESTS=(
  local-path-provisioner.yaml
)
