apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-ue-2
  namespace: ina-infra
  labels:
    app.kubernetes.io/name: oai-ue-2
    app.kubernetes.io/part-of: ina-infra
    slice: '2'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-ue-2
  template:
    metadata:
      labels:
        app: oai-ue-2
        app.kubernetes.io/name: oai-ue-2
        slice: '2'
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name": "ue2-sim-rf", "interface": "rf", "ips":
          ["10.1.140.142/24"], "gateways": ["10.1.140.3"]}]'
    spec:
      serviceAccountName: oai-ue-2-sa
      terminationGracePeriodSeconds: 5
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: usrp
      initContainers:
      - name: bringup-du
        image: docker.io/nicolaka/netshoot
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - "set -eu\nwait_tcp() {\n  # $1=label $2=host $3=port \u2014 process accepting\
          \ TCP (e.g. DU rfsim).\n  label=\"$1\"; host=\"$2\"; port=\"$3\"\n  echo\
          \ \"waiting for ${label} tcp://${host}:${port}\"\n  until (echo >/dev/tcp/${host}/${port})\
          \ >/dev/null 2>&1 \\\n     || nc -z -w2 \"$host\" \"$port\" >/dev/null 2>&1;\
          \ do\n    sleep 2\n  done\n  echo \"  ${label} ready\"\n}\nwait_sctp() {\n\
          \  # $1=label $2=host $3=port \u2014 SCTP listener (E1 / F1-C).\n  label=\"\
          $1\"; host=\"$2\"; port=\"$3\"\n  echo \"waiting for ${label} sctp://${host}:${port}\"\
          \n  until ncat --sctp -z -w2 \"$host\" \"$port\" >/dev/null 2>&1 \\\n  \
          \   || nmap -sY -p \"$port\" --host-timeout 3s \"$host\" 2>/dev/null | grep\
          \ -q \"open\"; do\n    sleep 2\n  done\n  echo \"  ${label} ready\"\n}\n\
          wait_ping() {\n  # $1=label $2=host \u2014 Multus / L3 up (CU-UP has no\
          \ E1 listener).\n  label=\"$1\"; host=\"$2\"\n  echo \"waiting for ${label}\
          \ icmp://${host}\"\n  until ping -c1 -W2 \"$host\" >/dev/null 2>&1; do\n\
          \    sleep 2\n  done\n  echo \"  ${label} ready\"\n}\nwait_nrf_upf() {\n\
          \  # $1=label $2=nrf_sbi $3=match_ip \u2014 UPF registered at NRF (HTTP/2).\n\
          \  label=\"$1\"; nrf=\"$2\"; match=\"$3\"\n  url=\"http://${nrf}/nnrf-nfm/v1/nf-instances?nf-type=UPF\"\
          \n  echo \"waiting for ${label} via NRF ${nrf} (match ${match})\"\n  until\
          \ curl -fsS --connect-timeout 2 --http2-prior-knowledge \"$url\" 2>/dev/null\
          \ \\\n      | grep -q \"$match\"; do\n    sleep 2\n  done\n  echo \"  ${label}\
          \ ready (NRF registered)\"\n}\necho \"dependency wait (bringup-du): service\
          \ ready checks\"\nwait_tcp \"du/rfsim\" \"10.1.140.204\" \"4043\"\necho\
          \ \"all dependencies ready \u2014 starting main container\""
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      containers:
      - name: bringup-order
        image: docker.io/nicolaka/netshoot
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - 'set -eu

          echo "bringup-order sidecar role=ue-2"

          echo ''depends on (see ina-infra/bringup_order.md):''

          echo ''  - DU rfsim TCP :4043''

          echo ''gated by bringup-* initContainers; sleeping''

          sleep infinity'
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
      - name: ue
        image: 10.1.132.30:5000/oai-nr-ue:nws-v0.8.2-amd64
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: USE_ADDITIONAL_OPTIONS
          value: -r 133 --numerology 1 -C 3325620000 --ssb 144 --rfsim --log_config.global_log_options
            level,nocolor,time --rfsimulator.serveraddr 10.1.140.204
        - name: TZ
          value: Europe/Paris
        volumeMounts:
        - name: configuration
          mountPath: /opt/oai-nr-ue/etc/nr-ue.conf
          subPath: ue.conf
      - name: debug
        image: docker.io/nicolaka/netshoot
        command:
        - sleep
        - infinity
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: configuration
        configMap:
          name: oai-ue-2-configmap
