# Site fabric DHCP — served from central-0 (hostNetwork, enp7s0).
# Dynamic pool avoids bridges, K8s nodes, and GPU workers (see docs/ip_plan.md).
authoritative;
default-lease-time 43200;
max-lease-time 86400;

subnet 10.1.137.0 netmask 255.255.255.0 {
  range 10.1.137.160 10.1.137.199;
  option subnet-mask 255.255.255.0;
  option broadcast-address 10.1.137.255;
  option routers 10.1.137.1;
  option domain-name-servers 10.1.132.200;
  option domain-name "nephio.lab";
}
