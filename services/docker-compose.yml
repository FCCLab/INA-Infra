services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: host
    env_file: .env
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_WEB_PASSWORD}
      FTLCONF_dns_interface: ${ENP1S0_PARENT}
      FTLCONF_dns_listeningMode: BIND
      FTLCONF_dns_domain_name: ${DOMAIN}
      FTLCONF_dns_upstreams: ${PIHOLE_UPSTREAM_DNS}
      FTLCONF_misc_etc_dnsmasq_d: "true"
      # Site DHCP is Glass/ISC on central K8s (10.1.137). Pi-hole is DNS-only.
      FTLCONF_dhcp_active: "false"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
