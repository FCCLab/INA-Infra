# Porch blueprint repo: fixed OAI packages on mgmt Gitea (push with push-oai-packages-to-gitea.sh).
# Apply after Gitea repo exists and branch v5 is pushed:
#   kubectl --context=mgmt@mgmt apply -f repo-oai-packages-gitea.yaml
#   ./sync-oai-packages-repo.sh
apiVersion: config.porch.kpt.dev/v1alpha1
kind: Repository
metadata:
  name: oai-packages
  namespace: default
  labels:
    kpt.dev/repository-content: external-blueprints
spec:
  content: Package
  deployment: false
  type: git
  git:
    branch: v5
    directory: /
    repo: http://gitea.gitea.svc.cluster.local:3000/nephio/oai-packages.git
    secretRef:
      name: git-user-secret
