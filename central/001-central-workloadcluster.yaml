---
# Register the kubeadm workload cluster "central" (10.1.101.22) with Nephio on mgmt.
# Apply on the management cluster after central Kubernetes is Ready:
#   kubectl --context=mgmt@mgmt apply -f 001-central-workloadcluster.yaml
#
# Label nephio.org/site-type=core matches OAI PackageVariantSet selectors (e.g. oai-common).
apiVersion: infra.nephio.org/v1alpha1
kind: WorkloadCluster
metadata:
  name: central
  namespace: default
  labels:
    nephio.org/site-type: core
spec:
  clusterName: central
