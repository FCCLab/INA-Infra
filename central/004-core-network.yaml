---
# OAI 5G SA control-plane network functions for workload clusters labeled site-type=core.
#
# Deploy order (after database + cp-operators are published):
#   1. NRF   — service discovery (other NFs wait for NRF healthy)
#   2. UDM, UDR, AUSF — subscriber/auth (UDR needs MySQL)
#   3. AMF, SMF — access and session management
#
#   kubectl --context=mgmt@mgmt apply -f 004-core-network.yaml
# Propose + approve each central-repo package revision (NRF first, then the rest).
#
# UPF (user plane) is not included — deploy oai-up-operators + oai-upf-edge on an edge cluster.
apiVersion: config.porch.kpt.dev/v1alpha2
kind: PackageVariantSet
metadata:
  name: core-oai-nrf
spec:
  upstream:
    repo: oai-packages
    package: oai-nrf
    workspaceName: v5
  targets:
  - objectSelector:
      apiVersion: infra.nephio.org/v1alpha1
      kind: WorkloadCluster
      matchLabels:
        nephio.org/site-type: core
    template:
      downstream:
        repo: central-repo
        package: oai-nrf
      annotations:
        approval.nephio.org/policy: initial
      injectors:
      - nameExpr: target.name
---
