# OAI MySQL database PackageVariantSet for workload clusters labeled site-type=core.
#
# Upstream: Gitea oai-packages (fixed Kptfiles), branch/workspace v5 — not GitHub oai-core-packages.
# Push packages first: ./push-oai-packages-to-gitea.sh
# Register Porch repo: kubectl apply -f repo-oai-packages-gitea.yaml && ./sync-oai-packages-repo.sh
#
#   kubectl --context=mgmt@mgmt apply -f 002-database.yaml
# Then propose + approve central-repo/database (readme Step 9).
apiVersion: config.porch.kpt.dev/v1alpha2
kind: PackageVariantSet
metadata:
  name: core-oai-database
spec:
  upstream:
    repo: oai-packages
    package: database
    workspaceName: v5
  targets:
  - objectSelector:
      apiVersion: infra.nephio.org/v1alpha1
      kind: WorkloadCluster
      matchLabels:
        nephio.org/site-type: core
    template:
      downstream:
        repo: central-repo
        package: database
      annotations:
        approval.nephio.org/policy: initial
      injectors:
      - nameExpr: target.name
