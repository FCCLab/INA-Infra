# WorkloadCluster registration for all workload sites (apply on mgmt).
# Run: ./configsync/setup_api_of_clusters.sh --fetch
#
# Site types match Nephio PackageVariantSet selectors (nephio.org/site-type).
# Kubeconfig secrets ({cluster}-kubeconfig) are created by the same script.
---
apiVersion: infra.nephio.org/v1alpha1
kind: WorkloadCluster
metadata:
  name: central
  namespace: default
  labels:
    nephio.org/site-type: core
spec:
  clusterName: central
---
apiVersion: infra.nephio.org/v1alpha1
kind: WorkloadCluster
metadata:
  name: regional
  namespace: default
  labels:
    nephio.org/site-type: regional
spec:
  clusterName: regional
---
apiVersion: infra.nephio.org/v1alpha1
kind: WorkloadCluster
metadata:
  name: edge
  namespace: default
  labels:
    nephio.org/site-type: edge
spec:
  clusterName: edge
---
apiVersion: infra.nephio.org/v1alpha1
kind: WorkloadCluster
metadata:
  name: ue
  namespace: default
  labels:
    nephio.org/site-type: ue
spec:
  clusterName: ue
