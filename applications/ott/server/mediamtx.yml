# MediaMTX configuration for OTT multi-channel video distribution
logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

metrics: no
playback: no
rtmp: no
srt: no

rtsp: yes
rtspAddress: :8555
protocols: [tcp]

hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: "*"
webrtcLocalUDPAddress: :8189
webrtcICEServers2: []

pathDefaults:
  source: publisher
  overridePublisher: yes

paths:
  all_others:
