# Dedicated Mosquitto broker for Slice D / IoT.
# Isolated lab broker: anonymous, no TLS, no persistence.
#
# :1883 — OTA / 5G path (UEs publish and subscribe over the PDU).
# :1884 — control plane (controller + dashboard). Same-pod clients use
#         127.0.0.1; docker-compose uses the service name.

listener 1883 0.0.0.0
allow_anonymous true

listener 1884 0.0.0.0
allow_anonymous true

persistence false
max_queued_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
