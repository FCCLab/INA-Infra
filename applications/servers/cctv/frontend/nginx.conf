server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Proxy REST API & Swagger docs to Backend on localhost
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8080/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8080/openapi.json;
        proxy_set_header Host $host;
    }

    # Proxy Snapshots & MJPEG streams to Backend on localhost
    location /snapshot/ {
        proxy_pass http://127.0.0.1:8080/snapshot/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    location /video/ {
        proxy_pass http://127.0.0.1:8080/video/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Proxy MediaMTX HLS streams on localhost.
    # MediaMTX sends Cache-Control: max-age=30 on playlists; that freezes live
    # players after the first cached playlist — force no-store for all /live/.
    location /live/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Proxy MediaMTX WebRTC WHEP on localhost
    location /whep/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
    }
}
