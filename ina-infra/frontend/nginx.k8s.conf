server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # In-cluster backend Service
    location /api/ {
        proxy_pass http://ina-infra-backend:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
    }

    location /docs {
        proxy_pass http://ina-infra-backend:8082/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /docs/ {
        proxy_pass http://ina-infra-backend:8082/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://ina-infra-backend:8082/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://ina-infra-backend:8082/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
