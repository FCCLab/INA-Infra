apiVersion: v1
kind: ConfigMap
metadata:
  name: oai-ausf-nf-conf
  namespace: oai-cn-operators
data:
  ausf.yaml: "############# Common configuration\n# Log level\nlog_level:\n  ausf:\
    \ {{ conf['logLevel'] }}\n# If you enable registration, the NF will use the NRF\
    \ discovery mechanism\nregister_nf:\n  ausf: 'yes'\nhttp_version: 2  # allowed\
    \ value 1 and 2, make sure all NFs use the same HTTP version\n############## SBI\
    \ Interfaces\n### Each NF takes its local SBI interfaces and remote interfaces\
    \ from here, unless it gets them using NRF discovery mechanisms\nnfs:\n  ausf:\n\
    \    host: {{ conf['fqdn']['ausf'] }}\n    sbi:\n      port: 80\n      api_version:\
    \ v1\n      interface_name: {{ conf['nfInterfaces']['sbi'] }}\n  udm:\n    host:\
    \ {{ conf['fqdn']['udm'] }}\n    sbi:\n      port: 80\n      api_version: v1\n\
    \  nrf:\n    host: {{ conf['fqdn']['nrf'] }}\n    sbi:\n      port: 80\n     \
    \ api_version: v1\n############## NF-specific configuration\nausf:\n  ausf_name:\
    \ \"OAI-AUSF\"\n"
