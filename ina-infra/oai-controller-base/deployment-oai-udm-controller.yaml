apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-udm-controller
  namespace: oai-cn-operators
  labels:
    app.kubernetes.io/name: oai-udm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-udm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-udm
    spec:
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      containers:
      - name: udm-controller
        image: docker.io/arorasagar/oai-udm-controller:v2.0.1
        imagePullPolicy: Always
        env:
        - name: NF_TYPE
          value: udm
        - name: DEPLOYMENT_FETCH_INTERVAL
          value: '1'
        - name: DEPLOYMENT_FETCH_ITERATIONS
          value: '100'
        - name: NF_CONF_PATH
          value: /tmp/nf/udm.yaml
        - name: OP_CONF_PATH
          value: /tmp/op/udm.yaml
        - name: TESTING
          value: 'no'
        - name: KUBERNETES_BASE_URL
          value: https://$(KUBERNETES_SERVICE_HOST):$(KUBERNETES_SERVICE_PORT)
        volumeMounts:
        - mountPath: /tmp/op
          name: opconf
        - mountPath: /tmp/nf
          name: nfconf
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 50m
        command:
        - /usr/local/bin/python
        - /root/.local/bin/kopf
        - run
        - /root/.local/controller.py
        - --namespace=oai-cn
      volumes:
      - configMap:
          name: oai-udm-op-conf
        name: opconf
      - configMap:
          name: oai-udm-nf-conf
        name: nfconf
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      serviceAccountName: oai-udm-operator
      terminationGracePeriodSeconds: 5
      nodeSelector:
        kubernetes.io/arch: amd64
