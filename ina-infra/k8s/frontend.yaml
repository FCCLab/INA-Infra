apiVersion: v1
kind: ConfigMap
metadata:
  name: ina-infra-nginx
  namespace: ina-infra
  labels:
    app.kubernetes.io/name: ina-infra-frontend
    app.kubernetes.io/part-of: ina-infra
data:
  default.conf: |
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        set $ina_backend "ina-infra-backend.ina-infra.svc.cluster.local";

        # With variables, omit URI on proxy_pass so full /api/... is forwarded.
        location /api/ {
            proxy_pass http://$ina_backend:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 900s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        location /docs {
            proxy_pass http://$ina_backend:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /docs/ {
            proxy_pass http://$ina_backend:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://$ina_backend:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://$ina_backend:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ina-infra-frontend
  namespace: ina-infra
  labels:
    app.kubernetes.io/name: ina-infra-frontend
    app.kubernetes.io/part-of: ina-infra
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30518
  selector:
    app.kubernetes.io/name: ina-infra-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ina-infra-frontend
  namespace: ina-infra
  labels:
    app.kubernetes.io/name: ina-infra-frontend
    app.kubernetes.io/part-of: ina-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ina-infra-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ina-infra-frontend
        app.kubernetes.io/part-of: ina-infra
    spec:
      containers:
        - name: frontend
          image: 10.1.132.30:5000/ina-infra/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: ina-infra-nginx
