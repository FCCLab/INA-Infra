apiVersion: v1
kind: Namespace
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: multi-cluster-dashboard
    app.kubernetes.io/part-of: dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
  namespace: dashboard
  labels:
    app.kubernetes.io/name: dashboard-backend
    app.kubernetes.io/part-of: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard-backend
        app.kubernetes.io/part-of: dashboard
    spec:
      containers:
        - name: backend
          image: 10.1.132.30:5000/dashboard/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: HOME
              value: /root
            - name: DASHBOARD_HOST
              value: 0.0.0.0
            - name: DASHBOARD_PORT
              value: "8090"
            - name: DASHBOARD_MGMT_KUBECONFIG
              value: /root/.kube/config
            - name: DASHBOARD_CENTRAL_KUBECONFIG
              value: /root/.kube/config-central
            - name: DASHBOARD_REGIONAL_KUBECONFIG
              value: /root/.kube/config-regional
            - name: DASHBOARD_EDGE_KUBECONFIG
              value: /root/.kube/config-edge
          volumeMounts:
            - name: kubeconfigs
              mountPath: /root/.kube
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: kubeconfigs
          secret:
            secretName: dashboard-kubeconfigs
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend
  namespace: dashboard
  labels:
    app.kubernetes.io/name: dashboard-backend
    app.kubernetes.io/part-of: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dashboard-backend
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-frontend
  namespace: dashboard
  labels:
    app.kubernetes.io/name: dashboard-frontend
    app.kubernetes.io/part-of: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard-frontend
        app.kubernetes.io/part-of: dashboard
    spec:
      containers:
        - name: frontend
          image: 10.1.132.30:5000/dashboard/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-frontend
  namespace: dashboard
  labels:
    app.kubernetes.io/name: dashboard-frontend
    app.kubernetes.io/part-of: dashboard
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dashboard-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30574
